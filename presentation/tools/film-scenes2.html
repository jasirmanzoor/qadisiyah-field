    const r = el(`<span class="reel"></span>`, box), seq = []; for (let l = 0; l < 2; l++) for (let d = 0; d <= 9; d++) seq.push(d); for (let d = 0; d <= +c; d++) seq.push(d);

    reels.push({ strip, n: seq.length, order: digits.length - 1 - digits.indexOf(i) });
  });
  return { box, play: (t, t0, dur = 2.6, stagger = .15) => reels.forEach((R) => {
    const u = clamp((t - t0 - R.order * stagger) / dur), y = -(R.n - 1) * ODO_EASE(u), bl = u < .35 ? u / .35 * 10 : (1 - eo((u - .35) / .65)) * 10;
    R.strip.style.transform = `translateY(${y.toFixed(4)}em)`; R.strip.style.filter = `blur(${(u > 0 && u < 1 ? bl : 0).toFixed(2)}px)`; }) };
}

/* ---------- CommitGrid ---------- */
const hash2 = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
const PAT = {
  ripple: (c, r, ox, oy, time, sp) => Math.sin(Math.hypot(c - ox, r - oy) * .5 - time * sp * 2) * .5 + .5,
  wave: (c, r, ox, oy, time, sp) => Math.sin(c * .3 - time * sp * 2) * .5 + .5,
};
const opacityOf = (b, intensity, maxOp, minOp = .08) => clamp(minOp + b * (maxOp - minOp) * intensity);   /* CommitGrid's cell alpha; minOp lifted in the film so the photos never sink to black */
async function tiles(n) {
  const names = ["s-sunset-row","s-qannas","s-dosari","s-glass","s-raad","s-subaie","s-shumukh","s-otaibi","s-qahtani","s-kathiri","s-nufai","s-ajyal","s-suwaidan","n-imad-facade","n-rayat","s-odaini","s-hall","s-jariwi","s-najoom","s-odaini-s","s-ramz","s-uruba","s-wafi","s-lc300","q-riyadhcars","q-nojoom","q-luxhall","q-redcarpet","q-safh-hall","q-safh-dark","q-tank","q-pickups","q-porsche","q-gclass","n-rc-hall","n-rc-facade","n-rc-mercedes","n-rc-merc2","n-hexhall","n-mezzanine","n-nojoom-facade","n-pickups","n-saber-facade","n-tank","s-future","s-jeeps","s-street","s-saber-street","s-imtiyaz","s-mawj","s-ustul","s-autopark","n-soum","q-street-ibtikar","q-street-fullspeed","q-street-binomaira","d0141-1","d0258-1","d0261-1","s0036-3","s0053-1","s0095-1","s13ads-2","s14sbr-2","s15byr-4","s16asm-1","s16nfy-1","s14wrd-1","s15aqd-1","s15nsm-1"];
  const ims = (await Promise.all(names.map((x) => load(`tiles/${x}.jpg`)))).filter(Boolean);
  return [...Array(n)].map((_, i) => ims[Math.floor(hash2(i * 1.7, i * .3) * ims.length)]);
}
function drawCell(g, im, x, y, s, rad) { g.save(); g.beginPath(); g.roundRect(x, y, s, s, rad); g.clip(); g.drawImage(im, x, y, s, s); g.restore(); }

if (S === "indep") {
  DUR = 8.6;
  const N = 307, COLS = 22, ROWS = Math.ceil(N / COLS), CELL = 50, GAP = 7, R = 8, GX = 640, GY = 130;
  const AUTH = [6, 58, 96, 141, 208, 263];    /* 6 manufacturer-authorised floors, spread through the grid */
  const cv = el(`<canvas class="cg" width="${W}" height="${H}" style="left:0;top:0"></canvas>`), g = cv.getContext("2d");
  el(`<div class="scrim" style="left:0;top:0;width:900px;height:1080px;background:linear-gradient(90deg,rgba(7,2,0,.92) 55%,rgba(7,2,0,0))"></div>`);
  const call = el(`<div class="call" style="left:${GX + (AUTH[0] % COLS) * (CELL + GAP) + CELL + 16}px;top:${GY + Math.floor(AUTH[0] / COLS) * (CELL + GAP) + 8}px"><i style="background:var(--teal);box-shadow:0 0 14px var(--teal)"></i><div><b>6 authorised</b><span>manufacturer-backed floors</span></div></div>`);
  const box = el(`<div class="abs" style="left:96px;top:300px;width:620px"></div>`);
  el(`<p class="kick" style="margin-bottom:26px">Who owns the floor</p>`, box);
  const odo = odometer(box, "98%"); const lead = el(`<p class="lead">of Al Qadisiyah floors<br>are fully independent</p>`, box);
  const ft = el(`<p class="foot">Only 6 of 307 floors asked hold a manufacturer authorisation.<span class="tag">OBSERVED · N=307</span></p>`, box);
  let T = [];
  boot = async () => { T = await tiles(N); };
  render = (t) => {
    g.clearRect(0, 0, W, H);
    const ox = COLS * .5, oy = ROWS * .5;
    for (let i = 0; i < N; i++) {
      const c = i % COLS, r = Math.floor(i / COLS), x = GX + c * (CELL + GAP), y = GY + r * (CELL + GAP);
      const appear = ss(t, .2 + Math.hypot(c - ox, r - oy) * .06, .7 + Math.hypot(c - ox, r - oy) * .06); if (appear <= 0) continue;
      if (AUTH.includes(i)) {
        const glow = ss(t, 3.0, 3.8);
        g.globalAlpha = appear * (.35 + .65 * glow); g.fillStyle = "#4fd1c5"; g.shadowColor = "#4fd1c5"; g.shadowBlur = 24 * glow; g.beginPath(); g.roundRect(x, y, CELL, CELL, R); g.fill(); g.shadowBlur = 0;
        continue;
      }
      g.globalAlpha = appear * opacityOf(PAT.ripple(c, r, ox, oy, t, 1), 1, 1, .62) * (1 - .25 * ss(t, 3.0, 3.8));
      drawCell(g, T[i], x, y, CELL, R);
    }
    g.globalAlpha = 1;
    fade(box.querySelector(".kick"), t, .4); odo.box.style.opacity = ss(t, .5, .9); odo.play(t, .5);
    fade(lead, t, 1.6); fade(ft, t, 2.4); fade(call, t, 3.4, .8, 10);
  };
}
if (S === "bank") {
  DUR = 8.6;
  const N = 13, CELL = 132, GAP = 10, R = 16, GX = (W - (N * CELL + (N - 1) * GAP)) / 2, GY = 300, BANK = [3, 9];
  const cv = el(`<canvas class="cg" width="${W}" height="${H}" style="left:0;top:0"></canvas>`), g = cv.getContext("2d");
  const cx = (i) => GX + i * (CELL + GAP);
  const c1 = el(`<div class="call" style="left:${cx(3)}px;top:${GY - 76}px"><i style="background:var(--gold);box-shadow:0 0 14px var(--gold)"></i><div><b>Bank on site</b><span>2 of 13 floors</span></div></div>`);
  const c2 = el(`<div class="call" style="left:${cx(10)}px;top:${GY - 76}px"><i style="background:#c9d2e3"></i><div><b>No lender</b><span>11 of 13 floors</span></div></div>`);
  const box = el(`<div class="abs" style="left:96px;top:560px;width:1100px"></div>`);
  el(`<p class="kick" style="margin-bottom:22px">Financing on the floor</p>`, box);
  const row = el(`<div style="display:flex;align-items:flex-end"></div>`, box); const odo = odometer(row, "11"); el(`<small style="font:700 64px/1 var(--d);letter-spacing:-.03em;margin:0 0 22px 16px">of 13</small>`, row);
  const lead = el(`<p class="lead">floors have no bank on site</p>`, box);
  const ft = el(`<p class="foot">Asked in 13 owner sit-downs. Only 5 of 25 owners named a partner bank.<span class="tag">OBSERVED · N=13</span></p>`, box);
  let T = [];
  boot = async () => { const all = await tiles(60); T = [4, 11, 19, 27, 33, 38, 41, 45, 50, 2, 8, 23, 30].map((k) => all[k]); };
  render = (t) => {
    g.clearRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const x = cx(i), y = GY, ap = ss(t, .2 + i * .08, .8 + i * .08); if (ap <= 0) continue;
      const lift = (1 - eo((t - .2 - i * .08) / .8)) * 40;
      if (BANK.includes(i)) {
        const glow = ss(t, 2.6, 3.4);
        g.globalAlpha = ap; drawCell(g, T[i], x, y + lift, CELL, R);
        g.globalAlpha = ap * glow; g.strokeStyle = "#ffb340"; g.lineWidth = 4; g.shadowColor = "#ffb340"; g.shadowBlur = 30; g.beginPath(); g.roundRect(x, y + lift, CELL, CELL, R); g.stroke(); g.shadowBlur = 0;
        g.fillStyle = "rgba(255,179,64,.22)"; g.fill(); continue;
      }
      g.globalAlpha = ap * opacityOf(PAT.wave(i, 0, 0, 0, t, 1), 1, 1, .62) * (1 - .3 * ss(t, 2.6, 3.4));
      drawCell(g, T[i], x, y + lift, CELL, R);
    }
    g.globalAlpha = 1;
    fade(box.querySelector(".kick"), t, .4); odo.box.style.opacity = ss(t, .5, .9); odo.play(t, .5); row.lastChild.style.opacity = ss(t, 1.4, 2.0);
    fade(lead, t, 1.8); fade(ft, t, 2.5); fade(c1, t, 3.0, .8, 10); fade(c2, t, 3.3, .8, 10);
  };
}

/* ---------- KAFD: one shot, nothing laid over it ---------- */
if (S === "kafd") {
  DUR = 9.0;
  document.querySelector(".brand").style.display = "none";
  const kw = el(`<div class="kw"><img></div>`), img = kw.querySelector("img");
  const tt = el(`<div class="ktitle"><p class="kick">Headquarters · King Abdullah Financial District</p><h2>From the showroom floor <em>to KAFD.</em></h2><p>Every record from the field was filed back to one roster, here at our Riyadh headquarters.</p></div>`);
  render = async (t) => {
    /* the title holds on black, leaves, and only then does the shot open from a horizontal slit */
    const tin = eo((t - .15) / .9), tout = ss(t, 1.9, 2.4);
    tt.style.opacity = (tin * (1 - tout)).toFixed(3); tt.style.transform = `translateY(${((1 - tin) * 20 - tout * 30).toFixed(1)}px)`;
    const open = eo((t - 2.3) / 1.1); kw.style.clipPath = `inset(${((1 - open) * 50).toFixed(2)}% 0 ${((1 - open) * 50).toFixed(2)}% 0)`;
    const f = Math.min(210, Math.max(1, 1 + Math.floor(Math.max(0, t - 2.3) * 30)));
    img.src = `kafdv/wide/f${String(f).padStart(4, "0")}.jpg`; img.style.transform = `scale(${(1.0 + .045 * clamp((t - 2.3) / 6.7)).toFixed(4)})`;
    await img.decode().catch(() => {});
  };
}
window.__dur = DUR; window.__render = (t) => render(t);
boot().then(() => Promise.all([...document.images].filter((i) => i.src).map((i) => i.decode().catch(() => {})))).then(() => document.fonts.ready)
  .then(async () => { await render(+(new URLSearchParams(location.search).get("t") || 0)); window.__ready = true; });
</script></body></html>
