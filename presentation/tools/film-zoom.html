<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@500&display=block">
<style>
/* Globe-to-block zoom for the film: one calibrated camera (Mercator zoom level + centre) drives every layer, so the
   globe, the satellite ladder, the outlines, the showroom dots and the labels all stay locked to the ground. */
:root { --ink: #fff; --soft: rgba(255,255,255,.74); --flame: #ff6a00; --flame-lit: #ff9a4a; --teal: #4fd1c5;
  --d: "Inter Tight", Inter, sans-serif; --s: "Instrument Serif", serif; --m: "IBM Plex Mono", monospace; --b: Inter, sans-serif; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #020101; color: var(--ink); font-family: var(--b); }
canvas { position: absolute; inset: 0; }
.lab { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
.lab .pin { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--flame); box-shadow: 0 0 0 6px rgba(255,106,0,.25), 0 0 30px var(--flame); }
.lab .stem { position: absolute; left: 0; bottom: 0; width: 2px; background: linear-gradient(0deg, var(--flame), rgba(255,154,74,.0)); }
.lab .card { position: absolute; left: 34px; bottom: 44px; white-space: nowrap; padding: 18px 24px 20px; border-radius: 14px; background: rgba(8,4,2,.72); border: 1px solid rgba(255,154,74,.45); backdrop-filter: blur(8px); }
.lab small { display: block; font: 500 15px/1 var(--m); letter-spacing: .24em; text-transform: uppercase; color: var(--flame-lit); }
.lab b { display: block; margin-top: 10px; font: 700 58px/1 var(--d); letter-spacing: -.035em; }
.lab b em { font-family: var(--s); font-weight: 400; font-style: italic; color: #ffd2ad; letter-spacing: -.01em; }
.lab span { display: block; margin-top: 10px; font: 400 21px/1.3 var(--b); color: var(--soft); }
.lab.big b { font-size: 76px; }
.lab.teal .pin { background: var(--teal); box-shadow: 0 0 0 6px rgba(79,209,197,.25), 0 0 30px var(--teal); }
.lab.teal .card { border-color: rgba(79,209,197,.5); } .lab.teal small { color: var(--teal); }
.lab.teal .stem { background: linear-gradient(0deg, var(--teal), rgba(79,209,197,0)); }
.hud { position: absolute; left: 64px; bottom: 54px; font: 500 17px/1.6 var(--m); letter-spacing: .14em; color: rgba(255,255,255,.82); text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.hud i { font-style: normal; color: var(--flame-lit); }
.scale { position: absolute; right: 64px; bottom: 58px; text-align: right; font: 500 16px/1 var(--m); letter-spacing: .14em; color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.scale div { height: 8px; margin-top: 10px; margin-left: auto; border: 2px solid rgba(255,255,255,.85); border-top: 0; }
.kick { position: absolute; left: 64px; top: 58px; font: 500 18px/1 var(--m); letter-spacing: .3em; text-transform: uppercase; color: var(--flame-lit); display: flex; align-items: center; gap: 16px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.kick::before { content: ""; width: 44px; height: 2px; background: var(--flame); }
.title { position: absolute; left: 64px; top: 96px; font: 700 64px/1 var(--d); letter-spacing: -.04em; text-shadow: 0 2px 24px rgba(0,0,0,.7); }
.title em { font-family: var(--s); font-weight: 400; font-style: italic; color: #ffd2ad; }
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="labs"></div>
<div class="kick" id="kick">Where it starts</div>
<div class="title" id="title">From orbit to <em>the showroom floor.</em></div>
<div class="hud" id="hud"></div>
<div class="scale" id="scale"><span></span><div></div></div>
<script>
const W = 1920, H = 1080, cv = document.getElementById("c"), g = cv.getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), mix = (a, b, u) => a + (b - a) * u;
const ss = (x, a, b) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const eio = (u) => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const D2R = Math.PI / 180;
/* Web Mercator in "world pixels" at zoom 0 (0..256) */
const mx = (lng) => (lng + 180) / 360 * 256, my = (lat) => (1 - Math.asinh(Math.tan(lat * D2R)) / Math.PI) / 2 * 256;
const lngOf = (x) => x / 256 * 360 - 180, latOf = (y) => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / 256))) / D2R;

const RIY = [24.70, 46.70], Q = [24.8255, 46.8241], S = [24.5475, 46.6835];

/* ---------------- camera ---------------- */
/* zoom keyframes (time s, zoom): monotone cubic so the speed through the ladder never jumps */
const ZK = [[0, 2.75], [2.0, 3.05], [6.0, 4.6], [10.0, 9.6], [14.6, 15.3], [17.2, 15.75]];
function hermite(K, t) {
  if (t <= K[0][0]) return K[0][1]; if (t >= K[K.length - 1][0]) return K[K.length - 1][1];
  const n = K.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((K[i + 1][1] - K[i][1]) / (K[i + 1][0] - K[i][0]));
  for (let i = 0; i < n; i++) m.push(i === 0 ? 0 : i === n - 1 ? 0 : (d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i])));
  let i = 0; while (t > K[i + 1][0]) i++;
  const h = K[i + 1][0] - K[i][0], s = (t - K[i][0]) / h, s2 = s * s, s3 = s2 * s;
  return (2 * s3 - 3 * s2 + 1) * K[i][1] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * K[i + 1][1] + (s3 - s2) * h * m[i + 1];
}
/* Q -> S flight: van Wijk & Nuij optimal zoom-pan (the path d3.interpolateZoom uses), in zoom-0 world pixels */
const F0 = 17.4, F1 = 22.6, ZS = 15.85;
function flight(u) {
  const p0 = [mx(Q[1]), my(Q[0])], p1 = [mx(S[1]), my(S[0])];
  const w0 = W / Math.pow(2, 15.75), w1 = W / Math.pow(2, ZS), rho = 1.5, r2 = rho * rho;
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1], d2 = dx * dx + dy * dy, d1 = Math.sqrt(d2);
  const b0 = (w1 * w1 - w0 * w0 + r2 * r2 * d2) / (2 * w0 * r2 * d1), b1 = (w1 * w1 - w0 * w0 - r2 * r2 * d2) / (2 * w1 * r2 * d1);
  const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0), r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1), Sd = (r1 - r0) / rho;
  const s = u * Sd, coshr0 = Math.cosh(r0), us = w0 / (r2 * d1) * (coshr0 * Math.tanh(rho * s + r0) - Math.sinh(r0));
  const w = w0 * coshr0 / Math.cosh(rho * s + r0);
  return { x: p0[0] + us * dx, y: p0[1] + us * dy, z: Math.log2(W / w) };
}
function cam(t) {
  if (t >= F0) {
    const u = eio((t - F0) / (F1 - F0)), f = flight(u), late = Math.max(0, t - F1);
    return { x: f.x, y: f.y, z: f.z + .22 * (1 - Math.exp(-late / 1.6)) };
  }
  const z = hermite(ZK, t), k = ss(z, 9.2, 13.2);
  return { x: mix(mx(RIY[1]), mx(Q[1]), k), y: mix(my(RIY[0]), my(Q[0]), k), z: z + (t > 17.2 ? .0 : 0) };
}
const DUR = 25.0;

/* ---------------- assets ---------------- */
const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => im.decode().then(() => ok(im), () => ok(im)); im.onerror = () => ok(null); im.src = src; });
let LAY = [], TEX = [], KSA = [], SHOPS = { q: [], s: [] }, STARS = [], CLOUDS = [], FEATHER;
async function boot() {
  const spec = await (await fetch("zoom/spec.json")).json();
  LAY = (await Promise.all(spec.map(async (l) => ({ ...l, im: await load(`zoom/${l.id}.jpg`) })))).filter((l) => l.im);
  for (const f of ["day.jpg", "day-4k.jpg"]) {
    const im = await load("globe/" + f), c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
    const x = c.getContext("2d"); x.drawImage(im, 0, 0); TEX.push({ w: im.width, h: im.height, d: x.getImageData(0, 0, im.width, im.height).data });
  }
  KSA = (await (await fetch("zoom/ksa.json")).json())[0];
  const csv = await (await fetch("data/showrooms.csv")).text(), rows = csv.trim().split("\n"), hd = rows[0].split(",");
  const iD = hd.indexOf("district"), iA = hd.indexOf("lat"), iN = hd.indexOf("lng");
  for (const r of rows.slice(1)) {   /* naive split is fine for the columns before name fields with commas: lat/lng are read from the right of the name columns */
    const c = r.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map((s) => s.replace(/,$/, ""));
    const la = +c[iA], ln = +c[iN]; if (!la || !ln) continue;
    (c[iD] === "Al Qadisiyah" ? SHOPS.q : c[iD] === "Al Shifa" ? SHOPS.s : []).push([la, ln]);
  }
  let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) STARS.push([rnd() * W, rnd() * H, rnd() * rnd() * 1.6 + .3, rnd()]);
  /* procedural cloud sprites */
  for (let k = 0; k < 4; k++) {
    const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
    for (let i = 0; i < 70; i++) {
      const px = 256 + (rnd() - .5) * 300, py = 256 + (rnd() - .5) * 170, r = 40 + rnd() * 90;
      const gr = x.createRadialGradient(px, py, 0, px, py, r); gr.addColorStop(0, `rgba(255,255,255,${.10 + rnd() * .08})`); gr.addColorStop(1, "rgba(255,255,255,0)");
      x.fillStyle = gr; x.fillRect(0, 0, 512, 512);
    }
    CLOUDS.push(c);
  }
  /* soft-edged mask so a finer satellite layer never shows a hard seam over the coarser one */
  FEATHER = document.createElement("canvas"); FEATHER.width = FEATHER.height = 256; const fx = FEATHER.getContext("2d");
  fx.filter = "blur(9px)"; fx.fillStyle = "#000"; fx.fillRect(20, 20, 216, 216);
  await document.fonts.ready;
  window.__ready = true;
}

/* ---------------- globe (orthographic, per pixel) ---------------- */
const gImg = g.createImageData(W, H);
function globe(lam, phi, R, alpha) {
  const T = R < 700 ? TEX[0] : TEX[1], tw = T.w, th = T.h, td = T.d, o = gImg.data, cx = W / 2, cy = H / 2;
  const sp = Math.sin(phi * D2R), cp = Math.cos(phi * D2R), atm = R * .06;
  for (let y = 0; y < H; y++) {
    const ny = -(y + .5 - cy) / R;
    for (let x = 0; x < W; x++) {
      const nx = (x + .5 - cx) / R, r2 = nx * nx + ny * ny, i = (y * W + x) * 4;
      if (r2 > 1) {
        const dr = (Math.sqrt(r2) - 1) * R, a = dr < atm * 4 ? Math.exp(-dr / atm) : 0;
        o[i] = 70 * a; o[i + 1] = 140 * a; o[i + 2] = 255 * a; o[i + 3] = 255 * a * .9; continue;
      }
      const z = Math.sqrt(1 - r2), la = Math.asin(clamp(z * sp + ny * cp, -1, 1)), lo = lam * D2R + Math.atan2(nx, z * cp - ny * sp);
      let u = ((lo / (2 * Math.PI) + .5) % 1 + 1) % 1 * (tw - 1), v = (.5 - la / Math.PI) * (th - 1);
      const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0, x1 = Math.min(tw - 1, x0 + 1), y1 = Math.min(th - 1, y0 + 1);
      const a = (y0 * tw + x0) * 4, b = (y0 * tw + x1) * 4, c = (y1 * tw + x0) * 4, d = (y1 * tw + x1) * 4;
      const sh = .5 + .5 * Math.pow(z, .6), rim = Math.pow(1 - z, 3);
      for (let k = 0; k < 3; k++) {
        const s = (td[a + k] * (1 - fx) + td[b + k] * fx) * (1 - fy) + (td[c + k] * (1 - fx) + td[d + k] * fx) * fy;
        o[i + k] = s * sh * (1 - rim * .6) + [90, 150, 255][k] * rim * .7;
      }
      o[i + 3] = 255;
    }
  }
  const c = globe.c || (globe.c = Object.assign(document.createElement("canvas"), { width: W, height: H }));
  c.getContext("2d").putImageData(gImg, 0, 0); g.globalAlpha = alpha; g.drawImage(c, 0, 0); g.globalAlpha = 1;
}
function orthoXY(lam, phi, R, la, lo) {
  const sp = Math.sin(phi * D2R), cp = Math.cos(phi * D2R), sl = Math.sin(la * D2R), cl = Math.cos(la * D2R), dl = (lo - lam) * D2R;
  const z = sp * sl + cp * cl * Math.cos(dl);
  return [W / 2 + R * cl * Math.sin(dl), H / 2 - R * (cp * sl - sp * cl * Math.cos(dl)), z];
}

/* ---------------- flat satellite ladder ---------------- */
const scratch = Object.assign(document.createElement("canvas"), { width: W, height: H }), sg = scratch.getContext("2d");
function flat(C, alpha) {
  const Z = C.z, list = LAY.filter((l) => l.z <= Z + .95 && l.z >= Math.floor(Z) - 2);
  /* coarse first; at equal zoom, the layer whose centre is nearest the camera goes on top */
  const cen = (l) => { const s = 256 / Math.pow(2, l.z); return [(l.x0 + l.n / 2) * s, (l.y0 + l.n / 2) * s]; };
  list.sort((a, b) => a.z - b.z || (Math.hypot(...cen(b).map((v, i) => v - [C.x, C.y][i])) - Math.hypot(...cen(a).map((v, i) => v - [C.x, C.y][i]))));
  g.save(); g.globalAlpha = alpha;
  for (const l of list) {
    const k = Math.pow(2, Z - l.z), s = 256 / Math.pow(2, l.z);      /* s: zoom-0 world px per tile at this level */
    const X = W / 2 + ((l.x0 * s - C.x) * Math.pow(2, Z)), Y = H / 2 + ((l.y0 * s - C.y) * Math.pow(2, Z)), sz = l.n * 256 * k;
    if (X > W || Y > H || X + sz < 0 || Y + sz < 0) continue;
    const a = l.z <= 3 ? 1 : ss(Z, l.z - 1.0, l.z - .45); if (a <= 0) continue;
    sg.globalCompositeOperation = "copy"; sg.drawImage(l.im, X, Y, sz, sz);
    if (l.z > 2) { sg.globalCompositeOperation = "destination-in"; sg.drawImage(FEATHER, X, Y, sz, sz); }
    g.globalAlpha = alpha * a; g.drawImage(scratch, 0, 0);
  }
  g.restore();
}
const P = (C, la, lo) => [W / 2 + (mx(lo) - C.x) * Math.pow(2, C.z), H / 2 + (my(la) - C.y) * Math.pow(2, C.z)];

/* ---------------- overlays ---------------- */
function ksaPath(proj, draw, a, glow) {
  if (a <= 0) return; const n = Math.max(2, Math.floor(KSA.length * draw));
  g.save(); g.beginPath(); let pen = false;
  for (let i = 0; i < n; i++) { const p = proj(KSA[i][1], KSA[i][0]); if (!p) { pen = false; continue; } pen ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); pen = true; }
  if (draw >= 1) { g.closePath(); g.fillStyle = `rgba(255,106,0,${.10 * a})`; g.fill(); }
  g.lineJoin = "round"; g.shadowColor = "rgba(255,106,0,.9)"; g.shadowBlur = 18 * glow;
  g.strokeStyle = `rgba(255,154,74,${.95 * a})`; g.lineWidth = 4; g.stroke(); g.restore();
}
function dots(C, pts, col, a, t0, t) {
  if (a <= 0) return; g.save(); const px = Math.pow(2, C.z - 15.5);
  pts.forEach(([la, lo], i) => {
    const p = P(C, la, lo), u = clamp((t - t0 - (i % 97) / 97 * 1.1) / .5); if (u <= 0) return;
    const r = (3.2 + 1.6 * px) * (u < 1 ? 1 + (1 - u) * 1.2 : 1);
    g.globalAlpha = a * u; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 14;

  });

}
function clouds(C, t) {
  /* two banks of cloud at virtual altitudes: they grow faster than the ground beneath, so the dive reads as depth */
  const banks = [[7.4, .55], [8.6, .42], [12.2, .3]];
  banks.forEach(([zc, op], bi) => {
    const k = Math.pow(2, (C.z - zc) * 1.6), a = op * ss(C.z, zc - 2.2, zc - 1.2) * (1 - ss(C.z, zc + .6, zc + 1.5)); if (a <= .01) return;
    for (let i = 0; i < 6; i++) {

      g.globalAlpha = a * .8; g.drawImage(CLOUDS[(i + bi) % 4], W / 2 + Math.cos(ang) * rr * k - cw / 2, H / 2 + Math.sin(ang) * rr * .6 * k - cw / 2, cw, cw);

/* labels (HTML), each pinned to the ground and lifted on a stem */
const labs = document.getElementById("labs");
function mkLab(cls, kick, title, line) {
  const e = document.createElement("div"); e.className = "lab " + cls;
  e.innerHTML = `<div class="stem"></div><div class="pin"></div><div class="card"><small>${kick}</small><b>${title}</b>${line ? `<span>${line}</span>` : ""}</div>`;
  labs.appendChild(e); return e;
}
const L1 = mkLab("big", "Kingdom of Saudi Arabia", "Saudi <em>Arabia</em>", "");
const L2 = mkLab("big", "24.71° N · 46.68° E", "Riyadh", "Capital of the Kingdom");
const L3 = mkLab("", "Block 01 · East Riyadh", "Al <em>Qadisiyah</em>", "309 showrooms · 20,831 cars on the floor");
const L4 = mkLab("teal", "Block 02 · South Riyadh", "Al <em>Shifa</em>", "211 showrooms · 11,038 cars on the floor");
function place(e, p, a, lift) {
  e.style.opacity = a.toFixed(3);
  e.style.transform = `translate3d(${p[0].toFixed(1)}px, ${p[1].toFixed(1)}px, 0)`;
  const st = e.querySelector(".stem"), cd = e.querySelector(".card"), L = 40 + lift * (1 - Math.pow(1 - a, 2));
  st.style.height = L + "px"; cd.style.bottom = (L + 4) + "px"; cd.style.transform = `translateY(${((1 - a) * 18).toFixed(1)}px)`;

/* ---------------- frame ---------------- */
function render(t) {
  const C = cam(t);
  g.globalCompositeOperation = "source-over"; g.fillStyle = "#020101"; g.fillRect(0, 0, W, H);
  /* globe phase: centre swings from the Atlantic to Riyadh while the camera falls; its radius is tied to the same zoom
     so the hand-off to the flat ladder is scale-matched (R = 256*2^z / (2*pi*cos(lat))) */
  const gu = eio(t / 5.6), lam = mix(-8, RIY[1], gu), phi = mix(6, RIY[0], gu), cosl = Math.cos(phi * D2R);
  const R = 256 * Math.pow(2, C.z) / (2 * Math.PI * cosl);
  const handoff = ss(t, 5.4, 6.4);
  if (handoff < 1) {
    STARS.forEach(([x, y, r, w]) => { g.globalAlpha = (.35 + .5 * w) * (1 - handoff); g.fillStyle = "#fff"; g.fillRect(x, y, r, r); }); g.globalAlpha = 1;
    globe(lam, phi, R, 1);
    const pj = (la, lo) => { const p = orthoXY(lam, phi, R, la, lo); return p[2] > 0 ? p : null; };
    ksaPath(pj, eio((t - 2.4) / 2.2), ss(t, 2.4, 3.0) * (1 - handoff * .0), 1);
  }
  if (handoff > 0) {
    flat(C, handoff);
    ksaPath((la, lo) => P(C, la, lo), 1, handoff * (1 - ss(C.z, 6.6, 7.8)), 1);
  }
  clouds(C, t);
  /* showroom dots: every located showroom from the census, at its real coordinates */
  dots(C, SHOPS.q, "#ff8a2a", ss(C.z, 13.6, 14.6) * (1 - ss(t, F0 + .6, F0 + 2.0)), 13.4, t);
  dots(C, SHOPS.s, "#4fd1c5", ss(t, F1 - 1.4, F1 - .6), F1 - 1.6, t);
  /* route line Q -> S during the flight */
  if (t > F0 && t < F1 + 1.2) {
    const a = ss(t, F0 + .3, F0 + 1.0) * (1 - ss(t, F1 + .2, F1 + 1.1)), u = eio((t - F0 - .3) / (F1 - F0 - .8));
    const p0 = P(C, Q[0], Q[1]), p1 = P(C, S[0], S[1]), pe = [mix(p0[0], p1[0], u), mix(p0[1], p1[1], u)];
    g.save(); g.globalAlpha = a; g.setLineDash([14, 12]); g.lineDashOffset = -t * 40; g.strokeStyle = "#ffb06a"; g.lineWidth = 5; g.shadowColor = "#ff6a00"; g.shadowBlur = 12;
    g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(pe[0], pe[1]); g.stroke(); g.setLineDash([]);
    g.fillStyle = "#fff"; g.beginPath(); g.arc(pe[0], pe[1], 6, 0, 7); g.fill();
    const la = ss(u, .15, .35) * (1 - ss(u, .85, .97));
    g.globalAlpha = a * la; g.shadowBlur = 0; g.font = "500 22px 'IBM Plex Mono'"; g.fillStyle = "#fff"; g.textAlign = "left";
    g.font = "500 26px 'IBM Plex Mono'"; g.shadowColor = "rgba(0,0,0,.9)"; g.shadowBlur = 10; g.fillText("34 KM ACROSS THE CITY", pe[0] + 30, pe[1] - 20); g.restore();
  }
  /* soft vignette keeps the labels legible over bright desert */
  const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  /* labels */

  place(L3, P(C, 24.8262, 46.8236), ss(C.z, 14.4, 15.0) * (1 - ss(t, F0 + .3, F0 + 1.2)), 210);
