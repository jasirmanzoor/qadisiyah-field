<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@500&display=block">
<style>
/* Built on the Ground: film scenes rendered frame by frame on a virtual clock. Slanted panels echo the field deck. */
:root { --bg: #070200; --ink: #fff; --soft: rgba(255,255,255,.72); --faint: rgba(255,255,255,.5); --flame: #ff6a00; --flame-lit: #ff9a4a;
  --d: "Inter Tight", Inter, sans-serif; --s: "Instrument Serif", serif; --m: "IBM Plex Mono", monospace; --b: Inter, sans-serif; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--b); }
.sc { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
.glow { position: absolute; inset: -10%; background: radial-gradient(55% 60% at 70% 55%, rgba(255,110,30,.16), transparent 70%), radial-gradient(40% 50% at 10% 90%, rgba(255,70,0,.10), transparent 70%); }
.pn { position: absolute; overflow: hidden; background: #140a05; box-shadow: 0 40px 90px -30px rgba(0,0,0,.9); will-change: transform, clip-path; }
.pn img { position: absolute; left: 50%; top: 50%; min-width: 100%; min-height: 100%; object-fit: cover; transform: translate(-50%, -50%); will-change: transform; }
.pn::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.copy { position: absolute; left: 120px; width: 700px; }
.kick { font: 500 19px/1 var(--m); letter-spacing: .3em; text-transform: uppercase; color: var(--flame-lit); margin: 0 0 30px; display: flex; align-items: center; gap: 16px; }
.kick::before { content: ""; width: 44px; height: 2px; background: var(--flame); }
h1 { margin: 0; font: 700 112px/.98 var(--d); letter-spacing: -.045em; }
h1 em, h2 em { font-family: var(--s); font-weight: 400; font-style: italic; letter-spacing: -.01em; color: #ffd2ad; }
h2 { margin: 0; font: 700 92px/.98 var(--d); letter-spacing: -.042em; }
.w { display: inline-block; will-change: transform, opacity, filter; }
.sub { margin: 34px 0 0; font: 400 28px/1.45 var(--b); color: var(--soft); max-width: 640px; }
.chips { display: flex; gap: 18px; margin-top: 44px; }
.chip { padding: 20px 24px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); width: 196px; }
.chip b { display: block; font: 700 46px/1 var(--d); letter-spacing: -.03em; color: #fff; }
.chip span { display: block; margin-top: 8px; font: 500 17px/1.3 var(--b); color: var(--soft); }
.verbs { margin-top: 40px; display: grid; gap: 4px; }
.verb { font: 700 58px/1.05 var(--d); letter-spacing: -.035em; color: rgba(255,255,255,.18); }
.verb.on { color: #fff; } .verb.now { color: var(--flame-lit); }
.cap { position: absolute; font: 500 18px/1.3 var(--m); letter-spacing: .16em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 8px; }
.callout { position: absolute; padding: 18px 22px; border-radius: 14px; background: rgba(12,5,1,.86); border: 1px solid rgba(255,154,74,.5); }
.callout small { display: block; font: 500 15px/1 var(--m); letter-spacing: .2em; text-transform: uppercase; color: var(--flame-lit); }
.callout b { display: block; margin-top: 10px; font: 700 54px/1 var(--d); letter-spacing: -.03em; }
.callout span { display: block; margin-top: 8px; font: 400 19px/1.35 var(--b); color: var(--soft); }
.steps { position: absolute; left: 120px; right: 120px; top: 460px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px; }
.step .pn { position: relative; height: 330px; }
.step h3 { margin: 26px 0 0; font: 600 34px/1.1 var(--d); letter-spacing: -.02em; }
.step p { margin: 8px 0 0; font: 400 21px/1.4 var(--b); color: var(--soft); }
.step i { display: block; font: 500 16px/1 var(--m); letter-spacing: .2em; color: var(--flame-lit); margin-top: 26px; font-style: normal; }
.line { position: absolute; height: 2px; background: linear-gradient(90deg, var(--flame), var(--flame-lit)); transform-origin: 0 50%; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.quote { margin-top: 46px; font: 400 italic 40px/1.3 var(--s); color: #ffe3cc; max-width: 1180px; }
.small { margin-top: 30px; font: 500 18px/1 var(--m); letter-spacing: .26em; text-transform: uppercase; color: var(--faint); }
.shade-b { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,2,0,.96) 0%, rgba(7,2,0,.75) 32%, rgba(7,2,0,0) 62%); }
.shade-l { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,2,0,.97) 0%, rgba(7,2,0,.88) 38%, rgba(7,2,0,0) 62%); }
.edge { position: absolute; top: -10%; bottom: -10%; width: 3px; background: linear-gradient(180deg, transparent, var(--flame-lit), transparent); transform: skewX(-8deg); filter: drop-shadow(0 0 12px var(--flame)); }
.brand { position: absolute; z-index: 60; left: 64px; top: 52px; text-shadow: 0 2px 12px rgba(0,0,0,.6); display: flex; align-items: center; gap: 14px; font: 600 24px/1 var(--d); letter-spacing: -.02em; }
.brand svg { width: 36px; height: 36px; }
</style></head><body>
<div class="brand" id="brand"><svg viewBox="0 0 28 28" fill="none"><path d="M14 1.6 20.3 8 14 14.4 7.7 8 14 1.6Z" fill="#FF6A00"/><path d="M6.4 9.3 12.7 15.7 6.4 22.1.1 15.7 6.4 9.3Z" fill="#FF3D00"/><path d="M21.6 9.3 27.9 15.7 21.6 22.1 15.3 15.7 21.6 9.3Z" fill="#FF9A2E"/></svg>Sub-Dealer Portfolio</div>
<div id="stage"></div>
<script>
const ACT = new URLSearchParams(location.search).get("act") || "1";
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 4), eio = (x) => { x = clamp(x); return x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2; };
const ramp = (t, a, d) => clamp((t - a) / d);
const pend = []; window.__settle = async () => { const p = pend.splice(0); await Promise.all(p.map((x) => x.catch(() => 0))); };
const SK = 8;   /* panel slant, degrees: the field deck's signature */
const slant = (w, h) => { const o = Math.tan(SK * Math.PI / 180) * h; return [o, w, h]; };
function poly(w, h, reveal = 1, dir = 1) {          /* a parallelogram; reveal 0..1 wipes it in along its slant */
  const o = Math.tan(SK * Math.PI / 180) * h, W = (w + o) * reveal;
  if (dir > 0) return `polygon(${o}px 0, ${Math.min(w, o + W)}px 0, ${Math.min(w - o, W)}px 100%, 0 100%)`;
  return `polygon(${Math.max(o, w - W)}px 0, ${w}px 0, ${w - o}px 100%, ${Math.max(0, w - o - W)}px 100%)`;
}
function panel(par, x, y, w, h, src) {
  const el = $(`<div class="pn" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${src}"></div>`); par.appendChild(el); el._w = w; el._h = h; el._img = el.firstChild; return el;
}
function seq(el, clip, n, t, rate = .75) {           /* drive a pan clip frame by frame; waits for decode before the frame is captured */
  const k = Math.min(n, 1 + Math.floor(t * 30 * rate)) ; const src = `bogpan/${clip}/f${String(k).padStart(4, "0")}.jpg`;
  if (el._img.dataset.src !== src) { el._img.dataset.src = src; el._img.src = src; pend.push(el._img.decode()); }
}
function words(h) {                                 /* wrap every word in a span; words inside <em> keep the italic */
  const sp = (txt) => txt.split(/(\s+)/).map((w) => w.trim() ? `<span class="w">${w}</span>` : w).join("");
  return h.split(/(<em>.*?<\/em>)/).map((part) => part.startsWith("<em>") ? "<em>" + sp(part.slice(4, -5)) + "</em>" : sp(part)).join("");
}
function rise(root, t, t0, step = .07, d = .9) { root.querySelectorAll(".w").forEach((w, i) => { const u = eo(ramp(t, t0 + i * step, d)); w.style.opacity = u; w.style.transform = `translateY(${(1 - u) * 70}px)`; w.style.filter = `blur(${(1 - u) * 10}px)`; }); }
function fade(el, t, t0, d = .7, y = 26) { const u = eo(ramp(t, t0, d)); el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * y}px)`; }
function kb(el, t, dur, z0 = 1.04, z1 = 1.14, dx = 0, dy = 0) { const u = clamp(t / dur); el._img.style.transform = `translate(calc(-50% + ${dx * u}px), calc(-50% + ${dy * u}px)) scale(${z0 + (z1 - z0) * u})`; }
function enter(el, t, t0, d = 1, dir = 1) { const u = eo(ramp(t, t0, d)); el.style.clipPath = poly(el._w, el._h, u, dir); el.style.transform = `translateY(${(1 - u) * 60}px)`; }

/* ---------- scenes: build() makes the DOM once, draw(t) poses it at local time t ---------- */
const S = [];
function scene(dur, build) { const el = $(`<div class="sc"><div class="glow"></div></div>`); document.getElementById("stage").appendChild(el); const draw = build(el); S.push({ el, dur, draw }); }

if (ACT === "1") {
/* S1: opening triptych of the drive-by footage */
scene(7.6, (r) => {
  const P = [[2623, 122], [2635, 177], [2620, 92]], W = 600, H = 1240, xs = [70, 660, 1250];
  const ps = P.map(([c], i) => panel(r, xs[i], -80, W, H, `bogpan/${c}/f0001.jpg`));
  r.appendChild($(`<div class="shade-b"></div>`));
  const c = $(`<div class="copy" style="bottom:120px;width:1100px"><p class="kick">Pre-launch · Riyadh fieldwork</p><h1>${words("Built on <em>the ground.</em>")}</h1><p class="sub" style="max-width:820px">Before launch, two people set out to learn Riyadh's independent car market. Door to door.</p></div>`); r.appendChild(c);
  return (t) => {
    ps.forEach((p, i) => { seq(p, P[i][0], P[i][1], Math.max(0, t - .15 * i), .62); enter(p, t, .1 + i * .22, 1.2); });
    rise(c.querySelector("h1"), t, 1.2, .1); fade(c.querySelector(".kick"), t, .9); fade(c.querySelector(".sub"), t, 2.2);
  };
});
/* S2: a small team, a critical mandate */
scene(7.4, (r) => {
  const a = panel(r, 980, 110, 820, 520, "bogph/008.jpg"), b = panel(r, 1010, 660, 430, 330, "bogph/010.jpg"), c = panel(r, 1470, 660, 380, 330, "bogph/000.jpg");
  const cp = $(`<div class="copy" style="top:150px"><p class="kick">Early team · Pre-launch</p><h2>${words("A small team. <em>A critical mandate.</em>")}</h2>
    <p class="sub">In retail, the team was two people: a retail executive and the director of retail.</p>
    <div class="chips"><div class="chip"><b>A few</b><span>people company-wide</span></div><div class="chip"><b>2</b><span>people in retail</span></div><div class="chip"><b>1</b><span>field mission</span></div></div></div>`); r.appendChild(cp);
  return (t) => {
    [a, b, c].forEach((p, i) => { enter(p, t, .2 + i * .25, 1.1); kb(p, t, 7.4, 1.04, 1.13, i % 2 ? -20 : 20); });
    fade(cp.querySelector(".kick"), t, .2); rise(cp.querySelector("h2"), t, .35, .08); fade(cp.querySelector(".sub"), t, 1.6);
    cp.querySelectorAll(".chip").forEach((x, i) => fade(x, t, 2.4 + i * .25, .7, 30));
  };
});
/* S3: into the market */
scene(7.6, (r) => {
  const v = panel(r, 1220, -40, 560, 1160, "bogpan/2636/f0001.jpg"), a = panel(r, 760, 110, 470, 400, "bogph/002.jpg"), b = panel(r, 700, 560, 480, 420, "bogph/026.jpg");
  r.appendChild($(`<div class="shade-l" style="background:linear-gradient(90deg,rgba(7,2,0,.97) 0%,rgba(7,2,0,.9) 30%,rgba(7,2,0,0) 44%)"></div>`));
  const cp = $(`<div class="copy" style="top:130px;width:560px"><p class="kick">On-field research</p><h2>${words("Into the <em>market.</em>")}</h2>
    <div class="verbs">${["Visit.", "Observe.", "Ask.", "Document.", "Repeat."].map((x) => `<div class="verb">${x}</div>`).join("")}</div>
    <p class="sub" style="font-size:24px">Ground truth had to be collected in person.</p></div>`); r.appendChild(cp);
  return (t) => {
    seq(v, 2636, 108, t, .55); enter(v, t, .05, 1.1); [a, b].forEach((p, i) => { enter(p, t, .35 + i * .25, 1.1, -1); kb(p, t, 7.6, 1.05, 1.15); });
    fade(cp.querySelector(".kick"), t, .1); rise(cp.querySelector("h2"), t, .2, .1);
    cp.querySelectorAll(".verb").forEach((x, i) => { const on = t > 1.4 + i * .62; x.classList.toggle("on", on); x.classList.toggle("now", on && t < 1.4 + (i + 1) * .62); x.style.transform = `translateX(${(1 - eo(ramp(t, 1.4 + i * .62, .5))) * -30}px)`; });
    fade(cp.querySelector(".sub"), t, 4.9);
  };
});
/* S4: every door, a new insight: a filmstrip of floors sliding past */
scene(7.2, (r) => {
  const L = ["034", "038", "028", "040", "006", "103", "105", "066", "068"], W = 520, H = 560, gap = 34;
  const strip = $(`<div style="position:absolute;left:0;top:330px;height:${H}px;width:${L.length * (W + gap)}px"></div>`); r.appendChild(strip);
  const ps = L.map((k, i) => panel(strip, i * (W + gap), 0, W, H, `bogph/${k}.jpg`));
  const cp = $(`<div class="copy" style="top:110px;width:1500px"><p class="kick">Showrooms · Direct observation</p><h2 style="font-size:84px">${words("Every door. <em>A new insight.</em>")}</h2></div>`); r.appendChild(cp);
  const cap = $(`<p class="sub" style="position:absolute;left:120px;top:930px;margin:0;max-width:1300px;font-size:25px">Showrooms varied in scale, format and stock. Each visit added to the picture of the independent dealer market.</p>`); r.appendChild(cap);
  return (t) => {
    strip.style.transform = `translateX(${300 - t * 190}px)`;
    ps.forEach((p, i) => { enter(p, t, .05 + i * .09, .9); kb(p, t, 7.2, 1.06, 1.12); });
    fade(cp.querySelector(".kick"), t, .1); rise(cp.querySelector("h2"), t, .2, .08); fade(cap, t, 1.6);
  };
});
/* S5: capturing ground truth — the windscreen notices */
scene(7.8, (r) => {
  const m = panel(r, 1420, 110, 400, 380, "bogph/054.jpg"), n = panel(r, 1400, 530, 420, 440, "bogph/048.jpg"), s = panel(r, 820, 110, 580, 860, "bogph/050.jpg");
  const co = $(`<div class="callout" style="left:120px;top:720px;width:600px"><small>On the windscreen · 2025 Rolls-Royce Spectre, 6,000 km</small><b>SAR 1,550,000</b><span>Asking prices, mileage and model year, read off the floor.</span></div>`); r.appendChild(co);
  const cp = $(`<div class="copy" style="top:150px;width:640px"><p class="kick">Field survey · Data collection</p><h2>${words("Capturing <em>ground truth.</em>")}</h2>
    <p class="sub" style="font-size:26px">Windscreen notices and showroom floors confirmed what desk research could not.</p>
    <div class="chips" style="flex-wrap:wrap;gap:12px;margin-top:36px">${["Pricing", "Inventory", "Year & mileage", "Dealer location"].map((x) => `<div class="chip" style="width:auto;padding:14px 18px"><span style="margin:0;font:600 20px/1 var(--d);color:#fff">${x}</span></div>`).join("")}</div></div>`); r.appendChild(cp);
  return (t) => {
    enter(s, t, .1, 1.1); enter(m, t, .4, 1, -1); enter(n, t, .65, 1, -1);
    s._img.style.transform = `translate(-50%, calc(-50% + ${-40 * eio(ramp(t, 1.4, 4))}px)) scale(${1.02 + .22 * eio(ramp(t, 1.4, 4))})`; kb(m, t, 7.8, 1.04, 1.12); kb(n, t, 7.8, 1.04, 1.1);
    fade(co, t, 2.4, .8, 30); fade(cp.querySelector(".kick"), t, .1); rise(cp.querySelector("h2"), t, .2, .1); fade(cp.querySelector(".sub"), t, 1.4);
    cp.querySelectorAll(".chip").forEach((x, i) => fade(x, t, 3 + i * .2, .6, 20));
  };
});
/* S6: the hours behind the work — a daylight panel, then the night arrives beside it */
scene(7.0, (r) => {
  const day = panel(r, 80, 90, 860, 640, "bogph/004.jpg"), n1 = panel(r, 980, 90, 860, 640, "bogph/066.jpg");
  const lab1 = $(`<div class="cap" style="left:130px;top:110px">Daylight · market visits</div>`), lab2 = $(`<div class="cap" style="left:1050px;top:110px">After dark · showroom floors</div>`); r.append(lab1, lab2);
  const cp = $(`<div class="copy" style="top:790px;width:1600px;display:flex;align-items:flex-end;gap:60px"><div><p class="kick">Field resilience · Day and night</p><h2 style="font-size:86px">${words("The hours <em>behind the work.</em>")}</h2></div><p class="sub" style="margin:0 0 10px;max-width:560px;font-size:25px">Not a staged campaign. Photographs from the work itself.</p></div>`); r.appendChild(cp);
  return (t) => {
    enter(day, t, .1, 1.1); enter(n1, t, 1.4, 1.2, -1); kb(day, t, 7, 1.06, 1.16, -20); kb(n1, t, 7, 1.14, 1.04, 20);
    fade(lab1, t, .6); fade(lab2, t, 2.2);
    fade(cp.querySelector(".kick"), t, .2); rise(cp.querySelector("h2"), t, .35, .09); fade(cp.querySelector(".sub"), t, 2.6);
  };
});
/* S7: from notes to insight — three steps, joined by a line */
scene(7.4, (r) => {
  const cp = $(`<div class="copy" style="top:120px;width:1500px"><p class="kick">Field intelligence · Team review</p><h2>${words("From notes <em>to insight.</em>")}</h2></div>`); r.appendChild(cp);
  const st = $(`<div class="steps"></div>`); r.appendChild(st);
  const D = [["075", "01", "Observe the market", "Bring back real dealer and vehicle information."], ["091", "02", "Organise findings", "Turn scattered notes into clear patterns."], ["093", "03", "Inform the model", "Use field knowledge as the foundation."]];
  const items = D.map(([k, n, h, p]) => { const s = $(`<div class="step"><div class="pn" style="height:330px"><img src="bogph/${k}.jpg"></div><i>${n}</i><h3>${h}</h3><p>${p}</p></div>`); st.appendChild(s); const pn = s.firstChild; pn._img = pn.firstChild; return s; });
  const ln = $(`<div class="line" style="left:120px;width:1680px;top:812px"></div>`); r.appendChild(ln);
  return (t) => {
    fade(cp.querySelector(".kick"), t, .1); rise(cp.querySelector("h2"), t, .2, .1);
    items.forEach((s, i) => { const a = .9 + i * .55; fade(s, t, a, .8, 40); const pn = s.firstChild; pn._w = pn.offsetWidth; pn._h = 330; pn.style.clipPath = poly(pn._w, 330, eo(ramp(t, a, 1))); kb(pn, t, 7.4, 1.04, 1.12); });
    ln.style.transform = `scaleX(${eio(ramp(t, 1.2, 2.6))})`;
  };
});
/* S8: the turn to the data */
scene(3.8, (r) => {
  r.querySelector(".glow").style.opacity = .5;
  const c = $(`<div class="center"><h2 style="font-size:104px">${words("This is <em>what they found.</em>")}</h2><div class="line" style="position:relative;width:520px;margin-top:40px"></div></div>`); r.appendChild(c);
  return (t) => { rise(c.querySelector("h2"), t, .2, .1, 1); c.querySelector(".line").style.transform = `scaleX(${eio(ramp(t, 1.1, 1.4))})`; };
});
} else {
/* C1: the people behind the work */
scene(7.4, (r) => {
  const a = panel(r, 900, 100, 470, 480, "bogph/117.jpg"), b = panel(r, 1400, 100, 420, 480, "bogph/121.jpg"), c = panel(r, 880, 610, 520, 380, "bogph/119.jpg"), d = panel(r, 1430, 610, 400, 380, "bogph/014.jpg");
  const cp = $(`<div class="copy" style="top:170px;width:700px"><p class="kick">People · Presence · Persistence</p><h2>${words("The people <em>behind the work.</em>")}</h2>
    <p class="sub">In the field, in Riyadh's dealer corridors. In the room, walking teams through it. A small-team mission, sustained by dedication.</p></div>`); r.appendChild(cp);
  return (t) => {
    [a, b, c, d].forEach((p, i) => { enter(p, t, .2 + i * .22, 1.1, i % 2 ? -1 : 1); kb(p, t, 7.4, 1.04, 1.13, i % 2 ? 18 : -18); });
    fade(cp.querySelector(".kick"), t, .1); rise(cp.querySelector("h2"), t, .25, .09); fade(cp.querySelector(".sub"), t, 1.8);
  };
});
/* C2: the foundation was built here */
scene(9.6, (r) => {
  const p = panel(r, 0, 0, 1920, 1080, "bogph/133.jpg"); p.style.boxShadow = "none"; p._img.style.filter = "saturate(1.15) brightness(.62)";
  r.appendChild($(`<div style="position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 50%,rgba(7,2,0,.35),rgba(7,2,0,.9))"></div>`));
  const c = $(`<div class="center"><p class="kick" style="justify-content:center">Contribution · Resilience · Impact</p><h2 style="font-size:112px">${words("The foundation <em>was built here.</em>")}</h2>
    <p class="quote">The earliest contribution is not always the most visible. Sometimes it is the one everything else stands on.</p><p class="small">The field research that helped shape AutoLink's business model</p></div>`); r.appendChild(c);
  return (t) => {
    kb(p, t, 9.6, 1.0, 1.12, 0, 20); p.style.opacity = eo(ramp(t, 0, 1.2));
    fade(c.querySelector(".kick"), t, .5); rise(c.querySelector("h2"), t, .8, .1, 1.1); fade(c.querySelector(".quote"), t, 3.2, 1.2, 20); fade(c.querySelector(".small"), t, 5.2, 1);
  };
});
}

/* timeline: scenes overlap by X s; the incoming scene arrives through a slanted wipe with a lit edge */
const X = .7, starts = []; let acc = 0; S.forEach((s, i) => { starts.push(acc); acc += s.dur - (i < S.length - 1 ? X : 0); });
window.__dur = acc; window.__starts = starts;
const wipeEdge = $(`<div class="edge" style="z-index:50;opacity:0"></div>`); document.body.appendChild(wipeEdge);
