<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@500&display=block">
<style>
/* Built on the Ground: film scenes rendered frame by frame on a virtual clock. Slanted panels echo the field deck. */
:root { --bg: #070200; --ink: #fff; --soft: rgba(255,255,255,.72); --faint: rgba(255,255,255,.5); --flame: #ff6a00; --flame-lit: #ff9a4a;
  --d: "Inter Tight", Inter, sans-serif; --s: "Instrument Serif", serif; --m: "IBM Plex Mono", monospace; --b: Inter, sans-serif; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--b); }
.sc { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
.glow { position: absolute; inset: -10%; background: radial-gradient(55% 60% at 70% 55%, rgba(255,110,30,.16), transparent 70%), radial-gradient(40% 50% at 10% 90%, rgba(255,70,0,.10), transparent 70%); }
.pn { position: absolute; overflow: hidden; background: #140a05; box-shadow: 0 40px 90px -30px rgba(0,0,0,.9); will-change: transform, clip-path; }
.pn img { position: absolute; left: 50%; top: 50%; min-width: 100%; min-height: 100%; object-fit: cover; transform: translate(-50%, -50%); will-change: transform; }
.pn::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.copy { position: absolute; left: 120px; width: 700px; }
.kick { font: 500 19px/1 var(--m); letter-spacing: .3em; text-transform: uppercase; color: var(--flame-lit); margin: 0 0 30px; display: flex; align-items: center; gap: 16px; }
.kick::before { content: ""; width: 44px; height: 2px; background: var(--flame); }
h1 { margin: 0; font: 700 112px/.98 var(--d); letter-spacing: -.045em; }
h1 em, h2 em { font-family: var(--s); font-weight: 400; font-style: italic; letter-spacing: -.01em; color: #ffd2ad; }
h2 { margin: 0; font: 700 92px/.98 var(--d); letter-spacing: -.042em; }
.w { display: inline-block; will-change: transform, opacity, filter; }
.sub { margin: 34px 0 0; font: 400 28px/1.45 var(--b); color: var(--soft); max-width: 640px; }
.chips { display: flex; gap: 18px; margin-top: 44px; }
.chip { padding: 20px 24px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); width: 196px; }
.chip b { display: block; font: 700 46px/1 var(--d); letter-spacing: -.03em; color: #fff; }
.chip span { display: block; margin-top: 8px; font: 500 17px/1.3 var(--b); color: var(--soft); }
.verbs { margin-top: 40px; display: grid; gap: 4px; }
.verb { font: 700 58px/1.05 var(--d); letter-spacing: -.035em; color: rgba(255,255,255,.18); }
.verb.on { color: #fff; } .verb.now { color: var(--flame-lit); }
.cap { position: absolute; font: 500 18px/1.3 var(--m); letter-spacing: .16em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 8px; }
.callout { position: absolute; padding: 18px 22px; border-radius: 14px; background: rgba(12,5,1,.86); border: 1px solid rgba(255,154,74,.5); }
.callout small { display: block; font: 500 15px/1 var(--m); letter-spacing: .2em; text-transform: uppercase; color: var(--flame-lit); }
.callout b { display: block; margin-top: 10px; font: 700 54px/1 var(--d); letter-spacing: -.03em; }
.callout span { display: block; margin-top: 8px; font: 400 19px/1.35 var(--b); color: var(--soft); }
.steps { position: absolute; left: 120px; right: 120px; top: 460px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px; }
.step .pn { position: relative; height: 330px; }
.step h3 { margin: 26px 0 0; font: 600 34px/1.1 var(--d); letter-spacing: -.02em; }
.step p { margin: 8px 0 0; font: 400 21px/1.4 var(--b); color: var(--soft); }
.step i { display: block; font: 500 16px/1 var(--m); letter-spacing: .2em; color: var(--flame-lit); margin-top: 26px; font-style: normal; }
.line { position: absolute; height: 2px; background: linear-gradient(90deg, var(--flame), var(--flame-lit)); transform-origin: 0 50%; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.quote { margin-top: 46px; font: 400 italic 40px/1.3 var(--s); color: #ffe3cc; max-width: 1180px; }
.small { margin-top: 30px; font: 500 18px/1 var(--m); letter-spacing: .26em; text-transform: uppercase; color: var(--faint); }
.shade-b { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,2,0,.96) 0%, rgba(7,2,0,.75) 32%, rgba(7,2,0,0) 62%); }
.shade-l { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,2,0,.97) 0%, rgba(7,2,0,.88) 38%, rgba(7,2,0,0) 62%); }
.edge { position: absolute; top: -10%; bottom: -10%; width: 3px; background: linear-gradient(180deg, transparent, var(--flame-lit), transparent); transform: skewX(-8deg); filter: drop-shadow(0 0 12px var(--flame)); }
.brand { position: absolute; z-index: 60; left: 64px; top: 52px; text-shadow: 0 2px 12px rgba(0,0,0,.6); display: flex; align-items: center; gap: 14px; font: 600 24px/1 var(--d); letter-spacing: -.02em; }
.brand img { height: 30px; width: auto; display: block; filter: drop-shadow(0 2px 10px rgba(0,0,0,.6)); }

/* InfiniteStory-style stack: full-bleed panels arrive from below, the previous one sinks, shrinks and dims */
.st-p { position: absolute; inset: 0; overflow: hidden; background: #000; will-change: transform; }
.st-p img { position: absolute; left: 0; top: -12%; width: 100%; height: 124%; object-fit: cover; will-change: transform; }
.st-p .dim { position: absolute; inset: 0; background: #000; opacity: 0; }
.st-p .grad { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,2,0,.88) 0%, rgba(5,2,0,.35) 38%, rgba(5,2,0,0) 60%); }
.st-mq { position: absolute; left: 0; top: 50%; white-space: nowrap; font: 800 300px/1 var(--d); letter-spacing: -.05em; color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.55); text-transform: uppercase; will-change: transform; mix-blend-mode: overlay; }
.st-cap { position: absolute; left: 120px; bottom: 110px; width: 1300px; }
.st-cap .n { font: 500 20px/1 var(--m); letter-spacing: .28em; color: var(--flame-lit); }
.st-cap h3 { margin: 18px 0 0; font: 700 104px/.96 var(--d); letter-spacing: -.045em; }
.st-cap h3 em { font-family: var(--s); font-weight: 400; font-style: italic; color: #ffd2ad; }
.st-cap p { margin: 18px 0 0; font: 400 28px/1.4 var(--b); color: var(--soft); max-width: 900px; }
.st-rail { position: absolute; right: 70px; top: 50%; display: grid; gap: 12px; transform: translateY(-50%); }
.st-rail i { display: block; width: 3px; height: 46px; background: rgba(255,255,255,.25); border-radius: 2px; }
.st-rail i.on { background: var(--flame-lit); box-shadow: 0 0 10px var(--flame); }
.ph3 { position: absolute; width: 380px; height: 690px; border-radius: 52px; background: #0b0b0d; padding: 12px; box-sizing: border-box; box-shadow: 0 60px 120px -30px rgba(0,0,0,.95), inset 0 0 0 2px rgba(255,255,255,.16); will-change: transform; }
.ph3 .scr { position: relative; width: 100%; height: 100%; border-radius: 41px; overflow: hidden; background: #000; }
.ph3 img { position: absolute; left: 0; top: 44px; width: 100%; height: calc(100% - 44px); object-fit: cover; object-position: top; will-change: transform; }
.ph3 .isl { position: absolute; left: 50%; top: 12px; width: 100px; height: 28px; margin-left: -50px; border-radius: 18px; background: #000; z-index: 2; }
.ph3 .cap { position: absolute; left: 0; right: 0; bottom: -46px; text-align: center; font: 500 15px/1 var(--m); letter-spacing: .2em; text-transform: uppercase; color: var(--flame-lit); }
</style></head><body>
<div class="brand" id="brand"><img src="brand/autolink-lockup.png" alt="AutoLink AI Tech"></div>
<div id="stage"></div>
<script>
const ACT = new URLSearchParams(location.search).get("act") || "1";
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 4), eio = (x) => { x = clamp(x); return x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2; };
const ramp = (t, a, d) => clamp((t - a) / d);
const pend = []; window.__settle = async () => { const p = pend.splice(0); await Promise.all(p.map((x) => x.catch(() => 0))); };
const SK = 8;   /* panel slant, degrees: the field deck's signature */
const slant = (w, h) => { const o = Math.tan(SK * Math.PI / 180) * h; return [o, w, h]; };
function poly(w, h, reveal = 1, dir = 1) {          /* a parallelogram; reveal 0..1 wipes it in along its slant */
  const o = Math.tan(SK * Math.PI / 180) * h, W = (w + o) * reveal;
  if (dir > 0) return `polygon(${o}px 0, ${Math.min(w, o + W)}px 0, ${Math.min(w - o, W)}px 100%, 0 100%)`;
  return `polygon(${Math.max(o, w - W)}px 0, ${w}px 0, ${w - o}px 100%, ${Math.max(0, w - o - W)}px 100%)`;
}
function panel(par, x, y, w, h, src) {
  const el = $(`<div class="pn" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="${src}"></div>`); par.appendChild(el); el._w = w; el._h = h; el._img = el.firstChild; return el;
}
function seq(el, clip, n, t, rate = .75) {           /* drive a pan clip frame by frame; waits for decode before the frame is captured */
  const k = Math.min(n, 1 + Math.floor(t * 30 * rate)) ; const src = `bogpan2/${clip}/f${String(k).padStart(4, "0")}.jpg`;
  if (el._img.dataset.src !== src) { el._img.dataset.src = src; el._img.src = src; pend.push(el._img.decode()); }
}
function zt(vs, t, t0, seg, z0 = 1.2) {                      /* still motion for field photos: focus-pull in, slow drift, zoom-through out, light sweep */
  vs.forEach((v, i) => {
    const a = t0 + i * seg, u = clamp((t - a) / .9), out = i < vs.length - 1 ? clamp((t - a - seg + .45) / .7) : 0, live = clamp((t - a) / (seg + .5));
    const sc = z0 - (z0 - 1.06) * eo(u) - .05 * live + .3 * out * out, bl = (1 - eo(u)) * 14 + out * 12, br = 1 + (1 - eo(u)) * .6;
    v._img.style.transform = `translate(-50%, -50%) scale(${sc.toFixed(4)})`; v._img.style.filter = `blur(${bl.toFixed(2)}px) brightness(${br.toFixed(3)})`;
    v.style.opacity = i === 0 ? (1 - out).toFixed(3) : (Math.min(1, u * 1.6) * (1 - out)).toFixed(3);
    if (!v._sw) { v._sw = $(`<div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(105deg,transparent 38%,rgba(255,214,170,.55) 50%,transparent 62%);background-size:260% 100%"></div>`); v.appendChild(v._sw); }
    v._sw.style.backgroundPosition = `${(130 - 160 * eo((t - a - .2) / 1.1)).toFixed(1)}% 0`; v._sw.style.opacity = (u > 0 && u < 1 ? 1 : 0) + "";
  });
}
function words(h) {                                 /* wrap every word in a span; words inside <em> keep the italic */
  const sp = (txt) => txt.split(/(\s+)/).map((w) => w.trim() ? `<span class="w">${w}</span>` : w).join("");
  return h.split(/(<em>.*?<\/em>)/).map((part) => part.startsWith("<em>") ? "<em>" + sp(part.slice(4, -5)) + "</em>" : sp(part)).join("");
}
function rise(root, t, t0, step = .07, d = .9) { root.querySelectorAll(".w").forEach((w, i) => { const u = eo(ramp(t, t0 + i * step, d)); w.style.opacity = u; w.style.transform = `translateY(${(1 - u) * 70}px)`; w.style.filter = `blur(${(1 - u) * 10}px)`; }); }
function fade(el, t, t0, d = .7, y = 26) { const u = eo(ramp(t, t0, d)); el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * y}px)`; }
function kb(el, t, dur, z0 = 1.04, z1 = 1.14, dx = 0, dy = 0) { const u = clamp(t / dur); el._img.style.transform = `translate(calc(-50% + ${dx * u}px), calc(-50% + ${dy * u}px)) scale(${z0 + (z1 - z0) * u})`; }
function enter(el, t, t0, d = 1, dir = 1) { const u = eo(ramp(t, t0, d)); el.style.clipPath = poly(el._w, el._h, u, dir); el.style.transform = `translateY(${(1 - u) * 60}px)`; }


function stack(r, items, seg) {
  /* items: [src, number, title html, line, marquee word]; one panel per seg seconds, each arriving over mv seconds */
  const mv = .95, H = 1080, els = items.map(([src, n, h, ln, mq, fy = 55], i) => {
    const el = $(`<div class="st-p" style="z-index:${i}"><img src="${src}" style="object-position:50% ${fy}%"><div class="grad"></div><div class="st-mq">${mq} · ${mq} · ${mq}</div><div class="dim"></div>
      <div class="st-cap"><div class="n">${n}</div><h3>${words(h)}</h3><p>${ln}</p></div></div>`); r.appendChild(el); return el; });
  const rail = $(`<div class="st-rail" style="z-index:99">${items.map(() => "<i></i>").join("")}</div>`); r.appendChild(rail);
  return (t) => {
    els.forEach((el, i) => {
      const a = i * seg, u = i === 0 ? 1 : eio(ramp(t, a, mv));
      const nxt = i < els.length - 1 ? eio(ramp(t, a + seg, mv)) : 0;
      el.style.transform = `translate3d(0, ${((1 - u) * H).toFixed(1)}px, 0) scale(${(1 - nxt * .08).toFixed(4)})`;
      el.style.display = t > a - .05 || i === 0 ? "" : "none";   /* display, not visibility: a visible child would show through a hidden scene */
      el.style.borderRadius = (nxt * 28).toFixed(1) + "px";
      el.querySelector(".dim").style.opacity = (nxt * .7).toFixed(3);
      const lt = t - a;
      el.querySelector("img").style.transform = `translate3d(0, ${(-4 + lt * 1.2 - (1 - u) * 6).toFixed(2)}%, 0) scale(${(1.06 + lt * .012).toFixed(4)})`;
      const mq = el.querySelector(".st-mq");
      mq.style.transform = `translate3d(${(-500 - lt * 260).toFixed(1)}px, -50%, 0) scale(${(1.35 - .1 * Math.min(1, lt / seg)).toFixed(3)})`;
      mq.style.opacity = (eo(ramp(t, a + .2, .8)) * (1 - nxt)).toFixed(3);
      const cap = el.querySelector(".st-cap"); rise(cap.querySelector("h3"), t, a + .45, .07, .8); fade(cap.querySelector(".n"), t, a + .35); fade(cap.querySelector("p"), t, a + 1.1);
    });
    const k = Math.min(els.length - 1, Math.floor(t / seg)); [...rail.children].forEach((x, i) => x.classList.toggle("on", i === k));
  };
}

/* ---------- scenes: build() makes the DOM once, draw(t) poses it at local time t ---------- */
const S = [];
function scene(dur, build) { const el = $(`<div class="sc"><div class="glow"></div></div>`); document.getElementById("stage").appendChild(el); const draw = build(el); S.push({ el, dur, draw }); }

if (ACT === "1") {
/* S1: opening triptych of the drive-by footage */
scene(7.6, (r) => {
  const P = [["c2640", 677], ["c2622", 348], ["c2623", 156]], W = 600, H = 1240, xs = [70, 660, 1250];
  const ps = P.map(([c], i) => panel(r, xs[i], -80, W, H, `bogpan2/${c}/f0001.jpg`));
  r.appendChild($(`<div class="shade-b"></div>`));
  const c = $(`<div class="copy" style="bottom:120px;width:1100px"><p class="kick">Pre-launch · Riyadh fieldwork</p><h1>${words("Built on <em>the ground.</em>")}</h1><p class="sub" style="max-width:820px">Before launch, two people set out to learn Riyadh's independent car market. Door to door.</p></div>`); r.appendChild(c);
  return (t) => {
    ps.forEach((p, i) => { seq(p, P[i][0], P[i][1], Math.max(0, t - .15 * i), .62); enter(p, t, .1 + i * .22, 1.2); });
    rise(c.querySelector("h1"), t, 1.2, .1); fade(c.querySelector(".kick"), t, .9); fade(c.querySelector(".sub"), t, 2.2);
  };
});
/* S2: the founder's vision */
scene(7.0, (r) => {
  /* field photos instead of the drive-by clip: three street shots crossfade with a slow push */
  const vs = ["field2/street.jpg", "field2/naseem.jpg", "field2/adwa.jpg"].map((src) => panel(r, 1000, -60, 820, 1200, src));
  const cp = $(`<div class="copy" style="top:200px;width:780px"><p class="kick">The founder's vision</p><h2>${words("Build what the market <em>runs on.</em>")}</h2>
    <p class="sub">Our founder and CEO set a bigger goal than a map: the network that connects Riyadh's dealers, buyers and lenders.</p></div>`); r.appendChild(cp);
  return (t) => { vs.forEach((v) => enter(v, t, .1, 1.2, -1)); zt(vs, t, .05, 2.3); fade(cp.querySelector(".kick"), t, .2); rise(cp.querySelector("h2"), t, .35, .08); fade(cp.querySelector(".sub"), t, 1.8); };
});
/* S3: a small team, a critical mandate */
scene(7.0, (r) => {
  const a = panel(r, 980, 110, 820, 520, "bp3/review1.jpg"), b = panel(r, 1010, 660, 430, 330, "bp3/selfie_kafd.jpg"), c = panel(r, 1470, 660, 380, 330, "bp3/car_laptop.jpg");
  const cp = $(`<div class="copy" style="top:150px"><p class="kick">Early team · Pre-launch</p><h2>${words("A small team. <em>A critical mandate.</em>")}</h2>
    <p class="sub">In retail, the team was two people: a retail executive and the director of retail.</p>
    <div class="chips"><div class="chip"><b>A few</b><span>people company-wide</span></div><div class="chip"><b>2</b><span>people in retail</span></div><div class="chip"><b>1</b><span>field mission</span></div></div></div>`); r.appendChild(cp);
  return (t) => {
    [a, b, c].forEach((p, i) => { enter(p, t, .2 + i * .25, 1.1); kb(p, t, 7, 1.04, 1.13, i % 2 ? -20 : 20); });
    fade(cp.querySelector(".kick"), t, .2); rise(cp.querySelector("h2"), t, .35, .08); fade(cp.querySelector(".sub"), t, 1.6);
    cp.querySelectorAll(".chip").forEach((x, i) => fade(x, t, 2.4 + i * .25, .7, 30));
  };
});
/* S4: into the market */
scene(7.4, (r) => {
  /* the field tools themselves, whole screens in phone frames: the survey app, the Google Earth pin map, Google Maps */
  const PH3 = [["field2/ph_app.jpg", "Survey app", 760, 210, -7], ["field2/ph_earth.jpg", "Google Earth", 1130, 150, 0], ["field2/ph_gmaps.jpg", "Google Maps", 1500, 210, 7]].map(([src, cap, x, y, rz]) => {
    const e = $(`<div class="ph3" style="left:${x}px;top:${y}px"><div class="scr"><div class="isl"></div><img src="${src}"></div><div class="cap">${cap}</div></div>`); r.appendChild(e); e._x = x; e._rz = rz; return e; });
  r.appendChild($(`<div class="shade-l" style="background:linear-gradient(90deg,rgba(7,2,0,.97) 0%,rgba(7,2,0,.9) 30%,rgba(7,2,0,0) 40%)"></div>`));
  const cp = $(`<div class="copy" style="top:130px;width:560px"><p class="kick">On-field research</p><h2>${words("Into the <em>market.</em>")}</h2>
    <div class="verbs">${["Visit.", "Observe.", "Ask.", "Document.", "Repeat."].map((x) => `<div class="verb">${x}</div>`).join("")}</div>
    <p class="sub" style="font-size:24px">Ground truth had to be collected in person.</p></div>`); r.appendChild(cp);
  return (t) => {
    PH3.forEach((e, i) => { const u = eo(ramp(t, .15 + i * .22, 1.2)), d = t - .15 - i * .22;
      e.style.opacity = Math.min(1, u * 1.5); e.style.transform = `perspective(1800px) translateY(${((1 - u) * 260 - d * 6).toFixed(1)}px) rotateZ(${(e._rz * (.6 + .4 * u)).toFixed(2)}deg) rotateY(${((1 - u) * -24).toFixed(2)}deg) scale(${(.92 + .08 * u).toFixed(3)})`;
      e.querySelector("img").style.transform = `translateY(${(-26 * clamp(d / 7)).toFixed(1)}px) scale(${(1 + .04 * clamp(d / 7)).toFixed(4)})`; });
    fade(cp.querySelector(".kick"), t, .1); rise(cp.querySelector("h2"), t, .2, .1);
    cp.querySelectorAll(".verb").forEach((x, i) => { const on = t > 1.4 + i * .62; x.classList.toggle("on", on); x.classList.toggle("now", on && t < 1.4 + (i + 1) * .62); x.style.transform = `translateX(${(1 - eo(ramp(t, 1.4 + i * .62, .5))) * -30}px)`; });
    fade(cp.querySelector(".sub"), t, 4.9);
  };
});
/* S5: day and night, as a stacked story */
scene(4 * 2.5 + .6, (r) => stack(r, [
  ["bp3/avenue2.jpg", "Daylight · Al Qadisiyah", "Door after door, <em>down the avenue.</em>", "Every showroom on the strip, visited and logged.", "Day", 62],
  ["bp3/fullspeed.jpg", "Daylight · the survey route", "Every sign, <em>every floor.</em>", "Names, stock and location, recorded at the door.", "Survey", 58],
  ["bp3/nightlot.jpg", "After dark · Al Shifa", "The market <em>trades at night.</em>", "So the survey carried on after sunset.", "Night", 72],
  ["bp3/dusk_prayer.jpg", "Dusk · between visits", "Prayer on <em>the showroom walk.</em>", "Long days, in the market's own rhythm.", "Dusk", 70],
], 2.5));
/* S6: every floor is different: the specialisations */
scene(4 * 2.5 + .6, (r) => stack(r, [
  ["bp3/trucks.jpg", "Specialists 01 · Commercial", "Fleet <em>trucks.</em>", "Some floors sell nothing but refrigerated trucks and light commercial vehicles.", "Trucks", 88],
  ["bp3/ambul.jpg", "Specialists 02 · Emergency service", "Ambulances <em>on the lot.</em>", "Others stock ambulances and service vehicles, by the row.", "Emergency", 62],
  ["bp3/adini.jpg", "Specialists 03 · Luxury", "Flagships, <em>under the lights.</em>", "A few hold only luxury sedans.", "Luxury", 70],
  ["bp3/covered.jpg", "Specialists 04 · Everyday", "The <em>everyday</em> floor.", "Most move the cars Riyadh drives every day.", "Volume", 70],
], 2.5));
/* S7: capturing ground truth — the windscreen notices */
scene(7.6, (r) => {
  const m = panel(r, 1420, 110, 400, 380, "bogph/054.jpg"), n = panel(r, 1400, 530, 420, 440, "bogph/048.jpg"), s = panel(r, 820, 110, 580, 860, "bogph/050.jpg");

/* timeline: scenes overlap by X s; the incoming scene arrives through a slanted wipe with a lit edge */
const X = .7, starts = []; let acc = 0; S.forEach((s, i) => { starts.push(acc); acc += s.dur - (i < S.length - 1 ? X : 0); });
window.__dur = acc; window.__starts = starts;
const wipeEdge = $(`<div class="edge" style="z-index:50;opacity:0"></div>`); document.body.appendChild(wipeEdge);
let t0 = null;
function frame(now) {
  if (t0 === null) t0 = now; const T = (now - t0) / 1000; let edgeOn = false;
  S.forEach((s, i) => {
    const lt = T - starts[i], vis = lt > -.05 && lt < s.dur + .05; s.el.style.visibility = vis ? "visible" : "hidden"; if (!vis) return;
    s.el.style.zIndex = i;
    if (i > 0 && lt < X) { const u = eio(lt / X), x = -300 + u * 2400; s.el.style.clipPath = `polygon(0 0, ${x + 150}px 0, ${x}px 1080px, 0 1080px)`; wipeEdge.style.left = (x + 75) + "px"; edgeOn = true; }
    else s.el.style.clipPath = "";
    s.draw(Math.max(0, lt));
  });
  wipeEdge.style.opacity = edgeOn ? 1 : 0;
  const bo = ACT === "1" ? 1 : 0; document.getElementById("brand").style.opacity = bo * clamp(T / .8) * (1 - clamp((T - (acc - 1.2)) / .8));
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
