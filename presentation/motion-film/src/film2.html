<!doctype html>
<html><head><meta charset="utf-8"><title>AutoLink Motion Film — look 2</title>
<style>
@font-face{font-family:ID;src:url(f/InterDisplay-Regular.otf);font-weight:400}
@font-face{font-family:ID;src:url(f/InterDisplay-Medium.otf);font-weight:500}
@font-face{font-family:ID;src:url(f/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:ID;src:url(f/InterDisplay-Black.otf);font-weight:900}
@font-face{font-family:JB;src:url(f/JetBrainsMono-Medium.ttf);font-weight:500}
@font-face{font-family:JB;src:url(f/JetBrainsMono-Bold.ttf);font-weight:700}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#04060a}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
</style></head>
<body>
<canvas id="bg" width="960" height="540"></canvas>
<canvas id="fg" width="1920" height="1080"></canvas>
<script src="geo.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="scenes2.js"></script>
<script src="bits.js"></script>
<script src="portal.js"></script>
<script src="dronepins.js"></script>
<script src="drone.js"></script>
<script src="scenes3.js"></script>
<script src="scenes4.js"></script>
<script src="reel.js"></script>
<script src="globe.js"></script>
<script>
Object.assign(SCENES, SC2); Object.assign(BGS, BG2);
window.ready = (async () => {
  const film = new URLSearchParams(location.search).get('film') || 'teaser';
  await Promise.all([400, 500, 700, 900].map(w => document.fonts.load(`${w} 64px ID`)).concat([document.fonts.load('500 20px JB'), document.fonts.load('700 20px JB')]));
  FILM = await (await fetch(`timeline_${film}.json`)).json(); FILM.id = film;
  const names = ['q-street-fullspeed', 'n-rc-night', 'q-riyadhcars-night', 'n-redcarpet', 'q-luxhall', 's-hall', 'n-porsche-row', 'q-barimi-rolls', 'n-rc-hall', 's-sunset-row', 'n-gclass-front', 'q-safh-dark', 's-glass', 'q-porsche', 'n-hexhall', 's-jeeps'];
  await Promise.all(names.map(async n => { IMG[n] = await loadImg(`img/${n}.jpg`); }));
  for (const n of ['loopmark', 'wordmark']) IMG[n] = await loadImg(`img/brand/${n}.png`);
  IMG.keyvisual = await loadImg('img/brand/keyvisual.jpg');
  for (const k of ['aljazira', 'albilad','alinma','anb','alrajhi','snb','riyad','enbd','raya','nama','tarabut','aljabr','taajeer','nfh','tamam','tamweel','alj','yanal','alyusr']) IMG['p-' + k] = await loadImg(`img/partners/${k}.png`);
  for (const k of ['00','10','20','01','11','21','02','12','22']) IMG['sh-' + k] = await loadImg(`sat/shifa18-${k}.jpg`);
  if (film === 'R') { IMG.earth = await loadImg('img/zoom/earth.jpg'); ZSPEC = await (await fetch('img/zoom/spec.json')).json(); for (let L = 5; L <= 15; L++) IMG['zoom' + L] = await loadImg(`img/zoom/L${L}.jpg`); }
  await DR.load('');
  window.seek(0);
  return { film, total: FILM.total, scenes: FILM.scenes.map(s => s.id) };
})();
</script>
</body></html>
