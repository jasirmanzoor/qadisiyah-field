<!doctype html><meta charset="utf-8"><title>fly-over score</title>
<script>
// 15 s score for the fly-over: an airy glide (D major colour), whooshes as the camera rises (8.66 s) and dives (9.80 s),
// the hit when the hero card lands (9.97 s), then a held chord under the title card.
window.renderScore = async function () {
  const SR = 48000, DUR = 15, TAIL = 2;
  const ctx = new OfflineAudioContext(2, SR * (DUR + TAIL), SR);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 2.5; comp.attack.value = .006; comp.release.value = .2;
  comp.connect(ctx.destination);
  // simple stereo reverb from decaying noise
  const ir = ctx.createBuffer(2, SR * 2.6, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let s = 11 + c * 7; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 1073741823.5 - 1) * Math.pow(1 - i / d.length, 3.2); } }
  const verb = ctx.createConvolver(); verb.buffer = ir; const vg = ctx.createGain(); vg.gain.value = .32; verb.connect(vg); vg.connect(comp);
  const bus = ctx.createGain(); bus.connect(comp); bus.connect(verb);
  const noiseBuf = (() => { const b = ctx.createBuffer(1, SR * 2, SR), d = b.getChannelData(0); let s = 3; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 1073741823.5 - 1; } return b; })();
  const tone = (t, f, dur, type, g, cut, att = .01, pan = 0) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cut;
    const a = ctx.createGain(); a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + att); a.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    o.connect(fl); fl.connect(a); a.connect(p); p.connect(bus); o.start(t); o.stop(t + dur + .05);
  };
  const pad = (t, fs, dur, g) => fs.forEach((f, i) => [-.06, .06].forEach((dt, j) => {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt * 100;
    const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(500, t); fl.frequency.linearRampToValueAtTime(1500, t + dur * .6); fl.frequency.linearRampToValueAtTime(700, t + dur);
    const a = ctx.createGain(); a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g / fs.length, t + Math.min(1.2, dur * .4)); a.gain.setValueAtTime(g / fs.length, t + dur - .6); a.gain.linearRampToValueAtTime(0, t + dur);
    const p = ctx.createStereoPanner(); p.pan.value = j ? .35 : -.35;
    o.connect(fl); fl.connect(a); a.connect(p); p.connect(bus); o.start(t); o.stop(t + dur + .05);
  }));
  const whoosh = (tPeak, len, g, up = true) => {
    const t0 = tPeak - len * .75, t1 = tPeak + len * .25;
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 1.4;
    fl.frequency.setValueAtTime(up ? 300 : 4000, t0); fl.frequency.exponentialRampToValueAtTime(up ? 5200 : 500, tPeak); fl.frequency.exponentialRampToValueAtTime(up ? 2000 : 200, t1);
    const a = ctx.createGain(); a.gain.setValueAtTime(.0001, t0); a.gain.exponentialRampToValueAtTime(g, tPeak); a.gain.exponentialRampToValueAtTime(.0001, t1);
    const p = ctx.createStereoPanner(); p.pan.setValueAtTime(-.6, t0); p.pan.linearRampToValueAtTime(.6, t1);
    n.connect(fl); fl.connect(a); a.connect(p); p.connect(bus); n.start(t0); n.stop(t1 + .05);
  };
  const hit = t => {
    const o = ctx.createOscillator(), a = ctx.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(36, t + .5);
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(.9, t + .004); a.gain.exponentialRampToValueAtTime(.001, t + 1.6);
    o.connect(a); a.connect(comp); o.start(t); o.stop(t + 1.7);
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 6500;
    const na = ctx.createGain(); na.gain.setValueAtTime(.35, t); na.gain.exponentialRampToValueAtTime(.0001, t + .9);
    n.connect(nf); nf.connect(na); na.connect(bus); n.start(t); n.stop(t + 1);
    [587.33, 880, 1174.66, 1760].forEach((f, i) => tone(t, f, 2.6, 'triangle', .07 / (i + 1), 6000, .003, i % 2 ? .3 : -.3));
  };
  // glide: soft pulse on eighths at 100 BPM, D – Bm – G – A colours under the camera
  const B = .6, chords = [[146.83, 220, 293.66, 369.99], [123.47, 185, 246.94, 293.66], [98, 196, 246.94, 293.66], [110, 220, 277.18, 329.63]];
  pad(0, chords[0], 2.4, .2); pad(2.4, chords[1], 2.4, .2); pad(4.8, chords[2], 2.4, .2); pad(7.2, chords[3], 2.8, .22);
  for (let k = 0; k < 16; k++) { const t = .3 + k * B / 2; const ch = chords[Math.min(3, Math.floor(t / 2.4))]; tone(t, ch[1 + k % 3] * 2, .5, 'sine', .055, 3000, .004, k % 2 ? .4 : -.4); }
  for (let k = 0; k < 6; k++) tone(k * 1.2 + .2, chords[Math.min(3, Math.floor(k * 1.2 / 2.4))][0] / 2, 1.1, 'sine', .22, 400, .02);
  whoosh(8.66, 1.3, .32, true); whoosh(9.80, .55, .36, false); hit(9.97);
  pad(9.97, [146.83, 220, 293.66, 369.99, 440], 5.03, .26);
  for (let k = 0; k < 8; k++) tone(10.4 + k * .55, [587.33, 739.99, 880, 739.99][k % 4], 1.2, 'sine', .035, 4000, .01, k % 2 ? .45 : -.45);
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = SR * DUR; let pk = 0;
  for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
  const k = Math.pow(10, -1.5 / 20) / pk, pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { const f = i > n - SR * .8 ? (n - i) / (SR * .8) : 1; pcm[2 * i] = L[i] * k * f * 32767; pcm[2 * i + 1] = R[i] * k * f * 32767; }
  const by = new Uint8Array(pcm.buffer); let s = ''; for (let i = 0; i < by.length; i += 0x8000) s += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000));
  return { sr: SR, b64: btoa(s) };
};
</script>
