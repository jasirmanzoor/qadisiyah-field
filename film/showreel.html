<!doctype html>
<html><head><meta charset="utf-8">
<title>AUTOLINK — Every door is a data point</title>
<style>
@font-face{font-family:"ID";font-weight:900;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf")}
@font-face{font-family:"ID";font-weight:800;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf")}
@font-face{font-family:"ID";font-weight:700;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf")}
@font-face{font-family:"ID";font-weight:600;src:url("file:///usr/share/fonts/opentype/inter/InterDisplay-SemiBold.otf")}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ============================================================
   AUTOLINK — "Every door is a data point."
   15 s · 120 BPM · 1920x1080. Everything is a pure function of t
   inside window.seek(t). No timers, no CSS animation, no state.
   ============================================================ */
const W=1920,H=1080,CX=960,CY=540,DT=1/60;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const O1='#1F5BFF',O2='#0B2FA8',O3='#6FB1FF',WH='#F7F9FF',BK='#000';
const FAM='"ID","Inter Display","Inter",sans-serif';
const F=(w,s)=>`${w} ${s}px ${FAM}`;

/* ---------- time math ---------- */
const cl=v=>v<0?0:v>1?1:v;
const P=(t,a,d)=>cl((t-a)/d);
const L=(a,b,k)=>a+(b-a)*k;
const eo=v=>v>=1?1:v<=0?0:1-Math.pow(2,-10*v);                 // exponential out
const eio=v=>v<=0?0:v>=1?1:v<.5?Math.pow(2,20*v-10)/2:(2-Math.pow(2,-20*v+10))/2;
// critically-damped spring (no overshoot): response at elapsed time t-a
const sp=(t,a,w=16)=>{const s=t-a;if(s<=0)return 0;return 1-(1+w*s)*Math.exp(-w*s);};
const D=d=>d*Math.PI/180;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- drawing helpers ---------- */
// directional motion smear: ghosts trail opposite to velocity (px/frame)
function smear(vx,vy,fn){
  const s=Math.hypot(vx,vy); if(s<2.5){fn(0,0);return;}
  const n=Math.min(12,Math.ceil(s/4)), ga=x.globalAlpha;
  for(let k=n;k>=1;k--){const f=k/n*1.15;x.globalAlpha=ga*.2*(1-k/n*.6);fn(-vx*f,-vy*f);}
  x.globalAlpha=ga; fn(0,0);
}
function poly(pts){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();}
function setF(w,s,ls=0){x.font=F(w,s);x.letterSpacing=ls+'px';}
function advances(str,w,fs,ls=0){setF(w,fs,ls);const xs=[];for(let i=0;i<=str.length;i++)xs.push(x.measureText(str.slice(0,i)).width);return xs;}
function rrect(x0,y0,w,h,r){x.beginPath();x.roundRect(x0,y0,w,h,r);}

/* Rolling text: digits roll like an odometer, other chars swap vertically.
   prog(i) 0..1 per char, dy(i) entrance/exit offset per char.
   Right-aligned at `right` (or left-aligned at `left` if align='l'). */
function rollText(o){
  const {from,to,w=900,fs,base,color,prog,dy=()=>0,dyPrev=null,align='r',pos,ls=0,clipTop=.86,clipBot=.2,colorFn=null}=o;
  const n=Math.max(from.length,to.length);
  const a=from.padStart(n,' '), b=to.padStart(n,' ');
  const xs=advances(b,w,fs,ls); const tw=xs[n];
  const left=align==='r'?pos-tw:align==='c'?pos-tw/2:pos;
  const lh=fs*1.08;
  x.save(); x.beginPath(); x.rect(0,base-fs*clipTop,W,fs*(clipTop+clipBot)); x.clip();
  setF(w,fs,ls); x.textBaseline='alphabetic';
  for(let i=0;i<n;i++){
    const p=cl(prog(i)), d=dy(i), v=dyPrev?d-dyPrev(i):0;
    x.fillStyle=colorFn?colorFn(i):color;
    const cx0=left+xs[i];
    const ca=a[i],cb=b[i];
    smear(0,v,(gx,gy)=>{
      if(ca===cb){ if(cb!==' ')x.fillText(cb,cx0+gx,base+d+gy); return; }
      const da=/\d/.test(ca), db=/\d/.test(cb);
      if(da&&db){
        const va=+ca, vb=+cb; let val=L(va,vb,p); const f0=Math.floor(val), fr=val-f0;
        x.fillText(String(f0%10),cx0+gx,base+d+gy-fr*lh);
        if(fr>0.001)x.fillText(String((f0+1)%10),cx0+gx,base+d+gy+(1-fr)*lh);
      }else{
        if(ca!==' ')x.fillText(ca,cx0+gx,base+d+gy-p*lh);
        if(cb!==' ')x.fillText(cb,cx0+gx,base+d+gy+(1-p)*lh);
      }
    });
  }
  x.restore();
  return {left,tw,xs};
}
/* Masked letters: each letter rises in (from below) and exits up. */
function letters(o){
  const {str,w=900,fs,left,base,color,colorFn,inT,outT=99,stagger=.014,outDir=-1,ls=0,clipTop=.86,clipBot=.14,wIn=28,wOut=26}=o;
  const xs=advances(str,w,fs,ls);
  const dyf=(i,t)=>fs*1.15*(1-sp(t,inT+i*stagger,wIn))+outDir*fs*1.2*sp(t,outT+i*stagger*.7,wOut);
  x.save();x.beginPath();x.rect(0,base-fs*clipTop,W,fs*(clipTop+clipBot));x.clip();
  setF(w,fs,ls);
  for(let i=0;i<str.length;i++){
    if(str[i]===' ')continue;
    x.fillStyle=colorFn?colorFn(i):color;
    const d=dyf(i,T), v=d-dyf(i,T-DT);
    smear(0,v,(gx,gy)=>x.fillText(str[i],left+xs[i]+gx,base+d+gy));
  }
  x.restore();
  return xs;
}
let T=0;

/* ---------- static data (built once, deterministic) ---------- */
const R=rng(20261101);
const NS=160;
function resample(pts,n){
  const segs=[];let per=0;
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push([a,b,l]);per+=l;}
  const out=[];let si=0,acc=0;
  for(let k=0;k<n;k++){const d=k/n*per;while(acc+segs[si][2]<d){acc+=segs[si][2];si++;}const [a,b,l]=segs[si];const f=(d-acc)/l;out.push([L(a[0],b[0],f),L(a[1],b[1],f)]);}
  return out;
}
// district outlines (start bottom-left, clockwise) in local units
const QL=[[-1,.7],[-.85,-.2],[-.45,-.75],[.55,-.62],[1,-.1],[.5,.4]].map(([a,b])=>[a*380,b*320]);
const SL=[[-.6,.5],[-.9,-.4],[-.3,-.9],[.4,-.7],[1,.2],[.3,.85]].map(([a,b])=>[a*230,b*200]);
const QC=[-300,-10], SC=[400,30];           // plane centres (relative to screen centre)
const SQ=resample([[-1,1],[-1,-1],[1,-1],[1,1]],NS), QR=resample(QL,NS), SR=resample(SL,NS);
function inPoly(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>p[1])!==(yj>p[1]))&&(p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi))c=!c;}return c;}
const DOTS=[];
function fill(polyL,cen,n,d,total){
  const inset=polyL.map(([a,b])=>[a*.88,b*.88]);let made=[];
  let minx=Math.min(...inset.map(p=>p[0])),maxx=Math.max(...inset.map(p=>p[0])),miny=Math.min(...inset.map(p=>p[1])),maxy=Math.max(...inset.map(p=>p[1]));
  while(made.length<n){const p=[L(minx,maxx,R()),L(miny,maxy,R())];if(inPoly(p,inset))made.push(p);}
  const ws=made.map(()=>Math.min(30,Math.pow(R(),-.75)));const sw=ws.reduce((a,b)=>a+b,0);
  made.forEach((p,i)=>DOTS.push({px:p[0]+cen[0],py:p[1]+cen[1],d,cars:ws[i]/sw*total,r:R()}));
}
fill(QL,QC,309,0,20831); fill(SL,SC,211,1,11038);
{ const maxc=Math.max(...DOTS.map(d=>d.cars));
  DOTS.forEach(d=>{d.h3=30+d.cars/maxc*210;d.h2=6+d.cars/maxc*514;});
  [...DOTS].sort((a,b)=>a.px-b.px).forEach((d,i)=>d.ru=i);
  [...DOTS].sort((a,b)=>b.cars-a.cars).forEach((d,i)=>d.rs=i);
  [0,1].forEach(k=>{const g=DOTS.filter(d=>d.d===k).sort((a,b)=>b.cars-a.cars);const mx=g[0].cars;g.forEach((d,i)=>{d.rd=i;d.nd=g.length;d.hs=3+d.cars/mx*57;});});
}
const chartX=r=>-800+(r+.5)*(1600/520);

// 520 tiles wall (26 x 20)
const TC=26,TR=20,TW=60,TH=40,TP=66,TPY=46;
const TILES=[];
for(let r=0;r<TR;r++)for(let c=0;c<TC;c++){const X=(c-12.5)*TP,Y=(r-9.5)*TPY;TILES.push({c,r,X,Y,dist:Math.hypot(X-33,Y-23),rn:R()});}
const CENTER_TILE=TILES.findIndex(t=>t.c===13&&t.r===10);
// logo assignment: tiles sorted by X; middle 432 split into 3 diamonds of 12x12 cells
const LOGO={cx:960,cy:385,s:118};
const DIA=[{c:[LOGO.cx-88,LOGO.cy+44],col:O2},{c:[LOGO.cx,LOGO.cy-44],col:O1},{c:[LOGO.cx+88,LOGO.cy+44],col:O3}];
{ const ord=TILES.map((t,i)=>i).sort((a,b)=>TILES[a].X-TILES[b].X||TILES[a].Y-TILES[b].Y);
  ord.forEach((ti,k)=>{const t=TILES[ti];const m=k-44;if(m<0||m>=432){t.dia=-1;return;}t.dia=Math.floor(m/144);});
  [0,1,2].forEach(di=>{const g=TILES.filter(t=>t.dia===di).sort((a,b)=>a.Y-b.Y||a.X-b.X);g.forEach((t,k)=>{t.cell=k;});});
}
// textures for the tile wall
function tex(draw){const c=document.createElement('canvas');c.width=TC*TP;c.height=TR*TPY;const g=c.getContext('2d');draw(g,c.width,c.height);return c;}
let TEXB,TEXC;
function buildTex(){
  TEXB=tex((g,w,h)=>{g.fillStyle=O1;g.fillRect(0,0,w,h);g.fillStyle=WH;g.textAlign='center';g.font=F(900,262);g.letterSpacing='-6px';g.fillText("RIYADH’S",w/2,400);g.fillText('CAR MARKET.',w/2,700);});
  TEXC=tex((g,w,h)=>{g.fillStyle=BK;g.fillRect(0,0,w,h);g.fillStyle=O1;g.textAlign='center';g.font=F(900,300);g.letterSpacing='-8px';g.fillText('MEASURED.',w/2,570);});
}

/* =================== BAR 1 — HOOK (0–2s) =================== */
const NSEG=26, LW=1680, DOORW=754, DOORH=380;
function bar1(t){
  if(t>=1.75) big520(t);
  const grow=eo(P(t,0,.45)), Wl=L(120,LW,grow), step=Wl/NSEG;
  const sc=tt=>-LW*eio(P(tt,.5,.5));
  const off=sc(t), vOff=off-sc(t-DT);
  const gap=L(1,.42,eo(P(t,.5,.3)));
  const conv=sp(t,1.5,15);
  const vConv=conv-sp(t-DT,1.5,15);
  const open=eio(P(t,1.75,.25)), ang=-D(108)*open;
  const x0d=CX-DOORW/2;
  for(let i=0;i<NSEG;i++){
    let cx=CX-Wl/2+(i+.5)*step, alpha=1;
    if(t>=.5){ cx=((cx+off-(CX-LW/2))%LW+LW)%LW+(CX-LW/2); const e=Math.min(cx-(CX-LW/2),(CX+LW/2)-cx); alpha=cl(e/70); }
    let w=step*(t<.5?1.02:gap);
    const hT=L(14,DOORH,sp(t,1.0+i*.014,16));
    const tx=x0d+(i+.5)*(DOORW/NSEG);
    const sx=cx; cx=L(cx,tx,conv); w=L(w,DOORW/NSEG+.6,conv);
    const col=t<.5?O1:[O1,O2,O3][i%3];
    x.globalAlpha=L(alpha,1,conv); x.fillStyle=col;
    if(open>0){
      const corners=[[cx-w/2,CY-hT/2],[cx+w/2,CY-hT/2],[cx+w/2,CY+hT/2],[cx-w/2,CY+hT/2]].map(([px,py])=>{
        const dx=px-x0d, X=x0d+dx*Math.cos(ang), Z=dx*Math.sin(ang), s=1400/(1400+Z);
        return [CX+(X-CX)*s, CY+(py-CY)*s];});
      poly(corners); x.fill();
    }else{
      const vx=t<1.5?(t>=.5&&t<1?vOff:0):(tx-sx)*vConv;
      smear(vx,0,(gx)=>x.fillRect(cx-w/2+gx,CY-hT/2,w,hT));
    }
  }
  x.globalAlpha=1;
}
/* big 520 (revealed behind the door, lands on beat 2.0) */
function big520Layout(){const xs=advances('520',900,380,-10);return {left:CX-xs[3]/2,base:CY+138,tw:xs[3]};}
function big520(t){
  const lay=big520Layout();
  const s=L(1.14,1,sp(t,1.75,13));
  x.save(); x.translate(CX,CY); x.scale(s,s); x.translate(-CX,-CY);
  rollText({from:'000',to:'520',fs:380,base:lay.base,color:O1,prog:i=>eo(P(t,1.75+i*.05,.3)),align:'c',pos:CX,ls:-10,clipTop:.9,clipBot:.12});
  x.restore();
}

/* =================== BAR 2 — KINETIC TYPE (2–4s) =================== */
const FS2=170, BASE2=600;
const LINES=[{n:'520',w:' SHOWROOMS',t0:2.5,t1:3.0},{n:'2',w:' DISTRICTS',t0:3.0,t1:3.5},{n:'1',w:' FIELD TEAM',t0:3.5,t1:4.0}];
function lineLayout(l){const s=l.n+l.w;const xs=advances(s,900,FS2,-4);const ds=FS2*.2,g=FS2*.07;const tot=xs[s.length]+g+ds;const left=CX-tot/2;return {s,xs,left,dotX:left+xs[s.length]+g,ds};}
const LL=LINES.map(lineLayout);
function dotState(t){
  // chain of spring targets for the orange full-stop
  const b=big520Layout(); let x0=b.left+b.tw+380*.06, bot=b.base, s=380*.2;
  LL.forEach((l,k)=>{const k2=sp(t,LINES[k].t0,17);x0=L(x0,l.dotX,k2);bot=L(bot,BASE2,k2);s=L(s,l.ds,k2);});
  return {x:x0,bot,s};
}
function drawDot(t){
  const d=dotState(t), dp=dotState(t-DT);
  x.fillStyle=O1;
  smear(d.x-dp.x,d.bot-dp.bot,(gx,gy)=>x.fillRect(d.x+gx,d.bot-d.s+gy,d.s,d.s));
}
function bar2(t){
  // the 520 shrinking into line 1
  const k=sp(t,2.5,14), b=big520Layout(), l1=LL[0];
  if(t<3.0){
    const fs=L(380,FS2,k), left=L(b.left,l1.left,k), base=L(b.base,BASE2,k);
    const xs=advances('520',900,fs,L(-10,-4,k));
    setF(900,fs,L(-10,-4,k)); x.fillStyle=O1;
    const kp=sp(t-DT,2.5,14), vx=(left-L(b.left,l1.left,kp)), vy=(base-L(b.base,BASE2,kp));
    smear(vx,vy,(gx,gy)=>{for(let i=0;i<3;i++)x.fillText('520'[i],left+xs[i]+gx,base+gy);});
    letters({str:l1.s,fs:FS2,left:l1.left,base:BASE2,ls:-4,colorFn:i=>i<3?'rgba(0,0,0,0)':WH,inT:2.5+.05,outT:3.0});
  }
  LINES.forEach((l,k)=>{
    if(k===0&&t<3.0)return;
    if(t<l.t0)return;
    const lay=LL[k];
    letters({str:lay.s,fs:FS2,left:lay.left,base:BASE2,ls:-4,colorFn:i=>i<l.n.length?O1:WH,inT:l.t0,outT:k===2?99:l.t1,outDir:-1});
  });
  drawDot(t);
}

/* =================== BAR 3 — SHAPE MORPH (4–6s) =================== */
function shapesAt(t){
  const d=dotState(3.999);
  const s1=sp(t,4.0,14);
  const cx=L(d.x+d.s/2,CX,s1), cy=L(d.bot-d.s/2,CY,s1), hs=L(d.s/2,150,s1);
  const s2=sp(t,4.5,12), s3=sp(t,5.0,12);
  const qc=[L(CX,CX+QC[0],s3),L(CY,CY+QC[1],s3)];
  const Q=SQ.map((p,i)=>{const sq=[cx+p[0]*hs,cy+p[1]*hs];const q=[qc[0]+QR[i][0],qc[1]+QR[i][1]];return [L(sq[0],q[0],s2),L(sq[1],q[1],s2)];});
  // Al Shifa buds off Qadisiyah's east edge
  const bud=[qc[0]+340,qc[1]-30];
  const sc=[L(bud[0],CX+SC[0],s3),L(bud[1],CY+SC[1],s3)];
  const S=QR.map((p,i)=>[L(bud[0]+p[0]*.18,sc[0]+SR[i][0],s3),L(bud[1]+p[1]*.18,sc[1]+SR[i][1],s3)]);
  return {Q,S,qc,sc,s3,cx,cy};
}
function bar3(t){
  // line 3 falls away through the baseline
  if(t<4.5){const lay=LL[2];letters({str:lay.s,fs:FS2,left:lay.left,base:BASE2,ls:-4,colorFn:i=>i<1?O1:WH,inT:3.5,outT:4.0,outDir:1});}
  const sh=shapesAt(t), pv=shapesAt(t-DT);
  const drain=1-sp(t,5.5,11);
  const drawP=(pts,c,col,vx,vy,showS)=>{
    if(t>=5.45){x.strokeStyle=col;x.lineWidth=3;poly(pts);x.stroke();}
    x.fillStyle=col;
    smear(vx,vy,(gx,gy)=>{poly(pts.map(p=>[c[0]+(p[0]-c[0])*drain+gx,c[1]+(p[1]-c[1])*drain+gy]));x.fill();});
  };
  const qcen=t<4.5?[sh.cx,sh.cy]:sh.qc;
  const pq=t<4.5?[pv.cx,pv.cy]:pv.qc;
  drawP(sh.Q,qcen,O1,qcen[0]-pq[0],qcen[1]-pq[1]);
  if(t>=5.0) drawP(sh.S,sh.sc,O3,sh.sc[0]-pv.sc[0],sh.sc[1]-pv.sc[1]);
  // showroom dots
  if(t>=5.5){DOTS.forEach(d=>{const s=7*sp(t,5.5+d.r*.35,22);if(s<.2)return;x.fillStyle=d.d?O3:O1;x.fillRect(CX+d.px-s/2,CY+d.py-s/2,s,s);});}
  // labels
  if(t>=5.5){
    const lab=(str,cx,base,col,t0)=>{const xs=advances(str,700,24,5);letters({str,w:700,fs:24,ls:5,left:cx-xs[str.length]/2,base,color:col,inT:t0,outT:6.0,outDir:1,stagger:.008});};
    lab('AL QADISIYAH · 309',CX+QC[0],CY+QC[1]+300,WH,5.55);
    lab('AL SHIFA · 211',CX+SC[0],CY+SC[1]+225,WH,5.62);
  }
}

/* =================== BAR 4/5 — 2D→3D, DATA (6–10s) =================== */
function cam(t){
  let th=D(58)*sp(t,6,10); th=L(th,D(90),sp(t,8,11));
  let rz=D(-16)*sp(t,7,7); rz=L(rz,0,sp(t,8,11));
  let zoom=1+.06*sp(t,6,8)+.05*sp(t,7,7); zoom=L(zoom,1,sp(t,8,11));
  let oy=130*sp(t,6,10); oy=L(oy,280,sp(t,8,11));
  return {th,rz,zoom,oy};
}
function P3(X,Y,Z,c){
  const cr=Math.cos(c.rz),sr=Math.sin(c.rz);const X1=X*cr-Y*sr,Y1=X*sr+Y*cr;
  const ct=Math.cos(c.th),st=Math.sin(c.th);const Y2=Y1*ct+Z*st,Z2=-Y1*st+Z*ct;
  const s=1500/(1500+Z2)*c.zoom;return [CX+X1*s,CY+c.oy+Y2*s,s,Z2];
}
function barState(d,t){
  const s1=sp(t,8,11);
  let X=L(d.px,chartX(d.ru),s1), Y=L(d.py,0,s1);
  X=L(X,chartX(d.rs),sp(t,8.5+d.r*.12+d.rs*.0004,12));
  const g=sp(t,6.5+d.r*.3,14);
  const h=L(d.h3*g,d.h2,s1);
  return {X,Y,h};
}
const barCol=(d,t)=>(t>=7.5&&d.rs<10)?WH:(d.d?O3:O1);
function bars3D(t){
  const c=cam(t), cp=cam(t-DT);
  // district outlines lying on the floor (collapse to the baseline in bar 5)
  const col=sp(t,8,11);
  [[QR,QC,O1],[SR,SC,O3]].forEach(([pts,cen,cc])=>{
    if(col>.985)return;
    const pp=pts.map(p=>P3(p[0]+cen[0],(p[1]+cen[1])*(1-col),0,c));
    x.strokeStyle=cc;x.lineWidth=3*(1-col)+.5;poly(pp);x.stroke();
  });
  const list=DOTS.map(d=>{const s=barState(d,t);const b=P3(s.X,s.Y,0,c);return {d,s,b};}).sort((a,b)=>b.b[3]-a.b[3]);
  x.lineCap='butt';
  for(const o of list){
    const {d,s,b}=o;
    const top=P3(s.X,s.Y,-Math.max(s.h,.01),c);
    const sp_=barState(d,t-DT), bp=P3(sp_.X,sp_.Y,0,cp);
    const lw=L(6,2.3,col)*b[2];
    x.strokeStyle=barCol(d,t); x.lineWidth=lw;

}
function PW(X,Y,Z,c){
  const cy=Math.cos(c.ry),sy=Math.sin(c.ry);const X1=X*cy+Z*sy,Z1=-X*sy+Z*cy;
