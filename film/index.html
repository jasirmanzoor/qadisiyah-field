<!doctype html>
<html><head><meta charset="utf-8"><title>AUTOLINK — Mapped</title>
<style>
html,body{margin:0;background:#fff;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="data.js"></script>
<script>
/* AUTOLINK — "MAPPED."  120 BPM · 30 s · every pixel is f(t) */
const W=1920,H=1080,BT=0.5;
const C={blue:'#2B4BFF',sky:'#A9C1FF',orange:'#FF5B1F',ink:'#0B0B0F',white:'#FFFFFF'};
const F='"Inter Display"';
const cv=document.getElementById('c'), X=cv.getContext('2d');
let ctx=X; // current target

/* ---------- math / easing ---------- */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const P=(t,a,d)=>cl((t-a)/d);
const eo=x=>x<=0?0:x>=1?1:(1-Math.pow(2,-10*x))/(1-Math.pow(2,-10));
const ei=x=>x<=0?0:x>=1?1:(Math.pow(2,10*x-10)-Math.pow(2,-10))/(1-Math.pow(2,-10));
const eio=x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2;
const spr=(dt,w=20)=>dt<=0?0:1-(1+w*dt)*Math.exp(-w*dt);      // critically damped: no overshoot
const sprN=(t,a,w=20)=>{const v=spr(t-a,w);return v>0.9995?1:v};
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function hexRgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function mixC(a,b,u){const A=hexRgb(a),B=hexRgb(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],u))).join(',')})`}

/* ---------- assets ---------- */
const IM=[];
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(i);i.src=src})}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const LAYER=mkCanvas(W,H), LX=LAYER.getContext('2d');
const ACC=mkCanvas(W,H), AX=ACC.getContext('2d');

/* ---------- drawing helpers ---------- */
function font(sz,wt=900){ctx.font=`${wt} ${sz}px ${F}`}
function img(i,x,y,w,h,z=1,fx=.5,fy=.5){
  if(w<=0.5||h<=0.5)return; const im=IM[((i%IM.length)+IM.length)%IM.length]; if(!im)return;
  const IW=im.width,IH=im.height,a=w/h; let sw,sh;
  if(a>IW/IH){sw=IW/z;sh=sw/a}else{sh=IH/z;sw=sh*a}
  const sx=cl((IW-sw)*fx,0,IW-sw), sy=cl((IH-sh)*fy,0,IH-sh);
  ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h);
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function clipRect(x,y,w,h){ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip()}
function pathPartial(pts,p){ // draw polyline up to fraction p
  if(p<=0||pts.length<2)return; let L=0;const seg=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
  let rem=L*cl(p);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length&&rem>0;i++){const d=seg[i-1];
    if(rem>=d){ctx.lineTo(pts[i][0],pts[i][1]);rem-=d}
    else{const u=rem/d;ctx.lineTo(lerp(pts[i-1][0],pts[i][0],u),lerp(pts[i-1][1],pts[i][1],u));rem=0}}
  ctx.stroke();
}
function brushEllipse(cx,cy,rx,ry,rot,p,col,lw,seed=1){ // hand-painted loop, overshoots 1.12 turns
  const pts=[],N=90;
  for(let i=0;i<=N;i++){const a=-Math.PI*0.62+ (i/N)*Math.PI*2*1.12;
    const k=1+0.035*Math.sin(a*3+seed)+0.05*(i/N);
    const x=Math.cos(a)*rx*k,y=Math.sin(a)*ry*k;
    pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';pathPartial(pts,p);ctx.restore();
}
function checkMark(x,y,r,p,bg,fg){ // disc + painted tick
  if(p<=0)return; const s=eo(cl(p*2));
  ctx.save();ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,r*s,0,7);ctx.fill();
  ctx.strokeStyle=fg;ctx.lineWidth=r*0.22;ctx.lineCap='round';ctx.lineJoin='round';
  pathPartial([[x-r*.42,y+r*.02],[x-r*.1,y+r*.32],[x+r*.45,y-r*.3]],eo(cl(p*2-0.6)));ctx.restore();
}
/* per-letter masked text: letters rise in at tin, leave upward at tout */
function word(str,o){
  const {x,y,size,color=C.ink,align='left',tin=-9,tout=99,dur=0.3,stg=0.014,wt=900,ls=-0.035,dirIn=1,dirOut=-1,clipPad=0.3}=o;
  font(size,wt);ctx.letterSpacing=(ls*size)+'px';
  const total=ctx.measureText(str).width; let x0=x; if(align==='center')x0=x-total/2; else if(align==='right')x0=x-total;
  const t=o.t; if(t<tin-0.001||t>tout+dur+stg*str.length)return {w:total,x0};
  ctx.save();clipRect(x0-size*0.3,y-size*(0.98),total+size*0.6,size*(1.0+clipPad));
  ctx.fillStyle=color;ctx.textBaseline='alphabetic';
  for(let i=0;i<str.length;i++){
    const ch=str[i]; if(ch===' ')continue;
    const px=x0+ctx.measureText(str.slice(0,i)).width;
    const pi=eo(P(t,tin+0.03+i*stg,dur)), po=eio(P(t,tout+i*stg*0.6,dur*0.72));
    const dy=(1-pi)*size*1.1*dirIn + po*size*1.25*dirOut;
    if(pi<=0||po>=1)continue;
    ctx.fillText(ch,px,y+dy);
  }
  ctx.restore();ctx.letterSpacing='0px';return {w:total,x0};
}
function measure(str,size,wt=900,ls=-0.035){font(size,wt);ctx.letterSpacing=(ls*size)+'px';const w=ctx.measureText(str).width;ctx.letterSpacing='0px';return w}
/* odometer: digits roll up to target as p goes 0..1 */
function odo(str,o){
  const {x,y,size,color=C.ink,align='left',p,wt=900,ls=-0.03,stg=0.06,out=0}=o;
  if(p<=0||out>=1)return; font(size,wt);ctx.letterSpacing=(ls*size)+'px';
  const total=ctx.measureText(str).width; let x0=align==='center'?x-total/2:align==='right'?x-total:x;
  ctx.save();clipRect(x0-20,y-size*0.95,total+40,size*1.2);ctx.translate(0,-eio(out)*size*1.1);ctx.fillStyle=color;
  const n=str.length;
  for(let i=0;i<n;i++){const ch=str[i];const px=x0+ctx.measureText(str.slice(0,i)).width;
    const q=eo(cl((p-(n-1-i)*stg/ (1+stg*n))*(1+stg*n)));
    if(/[0-9]/.test(ch)){const d=+ch;const v=q*(d+10);const k=Math.floor(v),f=v-k;
      ctx.fillText(String(k%10),px,y-f*size*1.05);if(f>0.001)ctx.fillText(String((k+1)%10),px,y+(1-f)*size*1.05);}
    else{ctx.fillText(ch,px,y+(1-q)*size*1.05)}}
  ctx.restore();ctx.letterSpacing='0px';
}

/* ---------- precomputed geometry (constants, not state) ---------- */
let Q=[],S=[],ALL=[],HULLQ,HULLS,CQ,CS,MSTQ,MSTS,RANK,WALLF,WALLB,MARK;
function hull(pts){const p=pts.map(a=>[a[0],a[1]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const q of p){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}
  for(const q of p.slice().reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}
  return lo.slice(0,-1).concat(up.slice(0,-1))}
function centroid(poly){let x=0,y=0;poly.forEach(p=>{x+=p[0];y+=p[1]});return [x/poly.length,y/poly.length]}
function rayPoly(poly,c,ang){ // ray from c at angle hits convex poly
  const dx=Math.cos(ang),dy=Math.sin(ang);let best=1e9;
  for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];
    const ex=b[0]-a[0],ey=b[1]-a[1];const den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)continue;
    const s=((a[0]-c[0])*ey-(a[1]-c[1])*ex)/den, u=((a[0]-c[0])*dy-(a[1]-c[1])*dx)/den;
    if(s>0&&u>=-1e-6&&u<=1+1e-6&&s<best)best=s}
  return [c[0]+dx*best,c[1]+dy*best]}
function mst(pts){const n=pts.length,inT=new Array(n).fill(false),d=new Array(n).fill(1e18),par=new Array(n).fill(-1),E=[];d[0]=0;
  for(let k=0;k<n;k++){let u=-1;for(let i=0;i<n;i++)if(!inT[i]&&(u<0||d[i]<d[u]))u=i;inT[u]=true;if(par[u]>=0)E.push([par[u],u]);
    for(let v=0;v<n;v++)if(!inT[v]){const dd=(pts[u][0]-pts[v][0])**2+(pts[u][1]-pts[v][1])**2;if(dd<d[v]){d[v]=dd;par[v]=u}}}
  return E}
function fit(raw,cx,cy,bw,bh,proj){
  const p=raw.map(proj);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;p.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const s=Math.min(bw/(x1-x0),bh/(y1-y0));return p.map(([x,y])=>[cx+(x-(x0+x1)/2)*s,cy+(y-(y0+y1)/2)*s])}
function padPoly(poly,c,pad){return poly.map(p=>{const dx=p[0]-c[0],dy=p[1]-c[1],L=Math.hypot(dx,dy);return [p[0]+dx/L*pad,p[1]+dy/L*pad]})}

const QC=[600,610], SC=[1390,610];
function prep(){
  const D=window.DATA;
  const qp=fit(D.Q,QC[0],QC[1],600,560,a=>[a[1]*Math.cos(24.8*Math.PI/180),-a[0]]);
  const sp=fit(D.S,SC[0],SC[1],560,330,a=>[a[1],-a[0]]);
  const qmax=Math.max(...D.Q.map(a=>a[2]));
  Q=qp.map((p,i)=>({x:p[0],y:p[1],v:D.Q[i][2],d:0}));S=sp.map((p,i)=>({x:p[0],y:p[1],v:D.S[i][2],d:1}));
  ALL=Q.concat(S);
  const cap=v=>Math.min(v,260);
  ALL.forEach((a,i)=>{a.h3=Math.pow(cap(a.v)/260,0.8)*300+6;a.i=i});
  // re-center dots so their centroid defines the morph centre
  HULLQ=hull(qp);HULLS=hull(sp);CQ=centroid(HULLQ);CS=centroid(HULLS);
  HULLQ=padPoly(HULLQ,CQ,22);HULLS=padPoly(HULLS,CS,22);
  MSTQ=mst(qp);MSTS=mst(sp);
  ALL.forEach(a=>{const c=a.d?CS:CQ;a.r=Math.hypot(a.x-c[0],a.y-c[1])});
  const mr=[Math.max(...Q.map(a=>a.r)),Math.max(...S.map(a=>a.r))];ALL.forEach(a=>a.rn=a.r/mr[a.d]);
  const sorted=ALL.slice().sort((a,b)=>b.v-a.v);sorted.forEach((a,r)=>a.rank=r);
  const vmax=sorted[2].v; ALL.forEach(a=>a.hc=Math.min(1,Math.pow(a.v/vmax,0.75)));
  // wall textures 16x16 tiles (front photos / back type)
  WALLF=mkCanvas(W,H);const wf=WALLF.getContext('2d');const sv=ctx;ctx=wf;
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){img(photoFor(4,i,j),i*120,j*67.5,120,67.5,1.1)}
  WALLB=mkCanvas(W,H);ctx=WALLB.getContext('2d');rect(0,0,W,H,C.blue);
  ctx.fillStyle=C.white;font(300);ctx.letterSpacing='-12px';ctx.textAlign='center';ctx.fillText('ORGANIZED.',W/2+10,540+120);ctx.textAlign='left';ctx.letterSpacing='0px';
  ctx=sv;
  // mark: three diamonds, tile grid positions inside each
  const a=82,g=1.07; MARK={a,cx:960,cy:392,D:[[0,-a*g*0.5,C.blue],[-a*g,a*g*0.5,C.blue],[a*g,a*g*0.5,C.sky]]};
  MARK.slots=[];for(let d=0;d<3;d++){const k=9;for(let u=0;u<k;u++)for(let v=0;v<k;v++){
    const su=((u+0.5)/k-0.5)*a*Math.SQRT2, sv2=((v+0.5)/k-0.5)*a*Math.SQRT2; // rotate 45°
    const x=(su-sv2)/Math.SQRT2,y=(su+sv2)/Math.SQRT2; MARK.slots.push([MARK.cx+MARK.D[d][0]+x,MARK.cy+MARK.D[d][1]+y,d])}}
}
const PH=[62,3,28,10,34,36,23,59,4,29,47,37,0,1,5,6,9,11,15,20,24,25,31,33,38,40,44,45,50,52,55,57,60,61,2,7,12,13,14,16,17,18,19,21,22,26,27,30,32,35,39,41,42,43,46,48,49,51,53,54,56,58,8];
function photoFor(L,i,j){return PH[Math.floor(hash(L*977+i*31+j*7+3)*PH.length)]}

/* ======================= SCENES ======================= */
/* Bar 1 — HOOK: line → shutter → painted sign → three columns */
const HR={x:120,y:67.5,w:1680,h:945};
function colRect(k,t){const g=24*eo(P(t,1.5,0.3));const w=(HR.w-2*g)/3;return {x:HR.x+k*(w+g),y:HR.y,w,h:HR.h}}
function sHook(t){
  if(t<0.5){const w=lerp(120,1680,eio(P(t,0,0.5)));rect(960-w/2,536,w,8,C.blue);return}
  const op=eo(P(t,0.5,0.42)); const h=lerp(8,HR.h,op); const y=540-h/2;
  const z=1.04+0.06*(t-0.5);
  if(t<1.5){
    ctx.save();clipRect(HR.x,y,HR.w,h);img(62,HR.x,HR.y,HR.w,HR.h,z,0.5,0.4);
    // paint on the sign
    const px=HR.x+HR.w*0.5, py=HR.y+HR.h*0.32;
    brushEllipse(px+10,py,HR.w*0.27,HR.h*0.13,-0.04,eo(P(t,1.0,0.42)),C.orange,13,2);
    ctx.restore();
    const bt=lerp(8,0,eo(P(t,0.78,0.3)));rect(HR.x,y-bt,HR.w,bt,C.blue);rect(HR.x,y+h,HR.w,bt,C.blue);
    // tag chip
    const cp=eo(P(t,1.12,0.3)); if(cp>0){ctx.save();const cw=300*cp;rect(HR.x+HR.w*0.5+380,HR.y+HR.h*0.5-6,cw,74,C.ink);clipRect(HR.x+HR.w*0.5+380,HR.y+HR.h*0.5-6,cw,74);
      word('001 / 520',{t,x:HR.x+HR.w*0.5+404,y:HR.y+HR.h*0.5+48,size:46,color:C.white,tin:1.16,wt:700,ls:0});ctx.restore()}
    return}
  hookCols(t);
}
function hookCols(t){ // 1.5 → 2.0 : columns, new photos roll in
  const ph=[[62,3],[62,28],[62,10]];
  for(let k=0;k<3;k++){const r=colRect(k,t);const dir=k===1?-1:1;const u=eio(P(t,1.56+k*0.05,0.36));
    ctx.save();clipRect(r.x,r.y,r.w,r.h);
    const oy=-dir*u*r.h;
    ctx.save();ctx.translate(0,oy);ctx.beginPath();ctx.rect(HR.x,HR.y,HR.w,HR.h);ctx.clip();
    img(62,HR.x,HR.y,HR.w,HR.h,1.04+0.06*(t-0.5),0.5,0.4);
    brushEllipse(HR.x+HR.w*0.5+10,HR.y+HR.h*0.32,HR.w*0.27,HR.h*0.13,-0.04,1,C.orange,13,2);
    ctx.restore();
    img(ph[k][1],r.x,r.y+oy+dir*r.h,r.w,r.h,1.0,0.5,0.5);
    ctx.restore();}
  // chip leaves left
  const cp=eio(P(t,1.5,0.3)); if(cp<1){const cx=HR.x+HR.w*0.5+380;ctx.save();clipRect(cx,HR.y+HR.h*0.5-6,300,74);ctx.translate(-cp*300,0);rect(cx,HR.y+HR.h*0.5-6,300,74,C.ink);
    font(46,700);ctx.fillStyle=C.white;ctx.fillText('001 / 520',cx+24,HR.y+HR.h*0.5+48);ctx.restore()}
}

/* Bar 2 — KINETIC TYPE: columns become photo-filled 520, then copy rolls */
const DIG={size:600,y:560};
function digitBoxes(size,cy){font(size);ctx.letterSpacing=(-0.04*size)+'px';const s='520',w=ctx.measureText(s).width,x0=960-w/2;const out=[];
  for(let i=0;i<3;i++){const px=x0+ctx.measureText(s.slice(0,i)).width;const m=ctx.measureText(s[i]);
    out.push({x:px,w:m.width-0.04*size,ch:s[i],base:cy+size*0.36})}ctx.letterSpacing='0px';return out}
function s520(t){
  // 2.0–2.4 columns collapse into glyphs (glyph mask zooms down from huge)
  const m=eio(P(t,2.0,0.42)); // morph
  const up=eio(P(t,2.5,0.4)); // move up / shrink
  const size=lerp(600,400,up), cy=lerp(560,400,up);
  const out=eio(P(t,4.0,0.36));
  const box=digitBoxes(size,cy);
  const fill=eo(P(t,2.5,0.32)); // blue wipe from bottom
  for(let k=0;k<3;k++){
    const r=colRect(k,Math.max(t,1.9)); const b=box[k];
    const capH=size*0.73;
    const tx=lerp(r.x,b.x,m),ty=lerp(r.y,b.base-capH,m),tw=lerp(r.w,b.w,m),th=lerp(r.h,capH,m);
    // render into layer: photo (and blue fill) masked by glyph scaled about its stroke anchor
    const L=LX; L.setTransform(1,0,0,1,0,0);L.clearRect(0,0,W,H);
    const sv=ctx;ctx=L;
    ctx.save();clipRect(tx,ty,tw,th);
    img([3,28,10][k],r.x+(tx-r.x)*0+0,0,0,0);
    img([3,28,10][k],tx-(1-m)*0,ty,tw,th,1+0.4*m,0.5,0.5);
    if(fill>0)rect(tx,ty+th*(1-fill),tw,th*fill+2,C.blue);
    ctx.restore();
    ctx.globalCompositeOperation='destination-in';
    const sc=lerp(14,1,eo(P(t,2.0,0.46)));
    const ax=b.x+b.w*(k===2?0.08:k===1?0.5:0.5), ay=b.base-capH*(k===2?0.5:k===1?0.9:0.62);
    ctx.save();ctx.translate(ax,ay);ctx.scale(sc,sc);ctx.translate(-ax,-ay);
    font(size);ctx.fillStyle='#000';ctx.fillText(b.ch,b.x,b.base);ctx.restore();
    ctx.globalCompositeOperation='source-over';ctx=sv;
    // exit at 4.0: slide up behind mask
    ctx.save();clipRect(0,cy-size*0.42,W,size*0.82);ctx.drawImage(LAYER,0,-out*size*0.9);ctx.restore();
  }
  if(t>=4.0-0.01) word('UNTIL',{t,x:960,y:cy+size*0.36,size,align:'center',tin:4.04,tout:5.0,stg:0.03});
  // copy line
  const ly=740;
  word('SHOWROOMS',{t,x:960,y:ly,size:150,align:'center',tin:2.5,tout:3.0});
  word('NEVER MAPPED.',{t,x:960,y:ly,size:150,align:'center',tin:3.0,tout:3.5,color:C.ink});
  word('NEVER SURVEYED.',{t,x:960,y:ly,size:150,align:'center',tin:3.5,tout:4.0,color:C.ink});
}
/* Bar 3 — UNTIL NOW. → the O becomes an iris */
function sNow(t){
  const size=400, base=400+size*0.36+410;
  const s='NOW.';font(size);ctx.letterSpacing=(-0.035*size)+'px';
  const tot=ctx.measureText(s).width,x0=960-tot/2;const oX=x0+ctx.measureText('N').width, oW=ctx.measureText('O').width;ctx.letterSpacing='0px';
  const capH=size*0.73, R0=capH*0.5+4; const ocx=oX+oW/2-size*0.02, ocy=base-capH/2;
  if(t<5.0){
    word('N',{t,x:x0,y:base,size,tin:4.5,tout:5.0});
    word('W.',{t,x:x0+measure('NO',size),y:base,size,tin:4.56,tout:5.0});
  }else{
    word('N',{t,x:x0,y:base,size,tin:4.5,tout:5.0,dirOut:1});
    word('W.',{t,x:x0+measure('NO',size),y:base,size,tin:4.56,tout:5.0,dirOut:1});
  }
  // disc
  const pin=eo(P(t,4.53,0.36));
  const g=eio(P(t,5.0,1.0));
  const cx=lerp(ocx,960,eio(P(t,5.0,0.5))), cy=lerp(ocy,540,eio(P(t,5.0,0.5)));
  const R=lerp(R0,1120,g)*pin;
  if(R<=0)return;

function logoSlot(i){ // banks: rows 0-1, finance: rows 2-4 (last row centred)
  const row=Math.floor(i/4),col=i%4; let x=LG.x+col*(LG.w+LG.g), y=LG.y+row*(LG.h+LG.g)+(row>=2?16:0);
  if(row===4){x+=(LG.w+LG.g)/2}
  return {x,y,w:LG.w,h:LG.h}}
function logoTile(lg,r,s){
  if(s<=0)return; const cx=r.x+r.w/2,cy=r.y+r.h/2,w=r.w*s,h=r.h*s,x=cx-w/2,y=cy-h/2;
  ctx.save();rrect(x,y,w,h,12*s);ctx.fillStyle=C.white;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#DCE1EA';ctx.stroke();
  rrect(x,y,w,h,12*s);ctx.clip();
  if(lg.img){
    if(lg.fill){ // full-bleed brand plates
      const a=lg.img.width/lg.img.height; let dw=w,dh=w/a; if(dh>h){dh=h;dw=h*a}
      ctx.fillStyle=lg.bg;ctx.fillRect(x,y,w,h);ctx.drawImage(lg.img,cx-dw/2,cy-dh/2,dw,dh);
    }else{const pad=14*s,a=lg.img.width/lg.img.height;let dw=w-2*pad,dh=dw/a;if(dh>h-2*pad){dh=h-2*pad;dw=dh*a}
      ctx.drawImage(lg.img,cx-dw/2,cy-dh/2,dw,dh)}
  }else{font(30*s,800);ctx.fillStyle=C.ink;ctx.textAlign='center';ctx.fillText(lg.name,cx,cy+10*s);ctx.textAlign='left'}
  ctx.restore();
}
function network2(t,conv){
  const cardR=[260+760*0.42/2,545];
  const LGS=window.LOGOS||[];
  const lp=eo(P(t,20.78,0.22));
  ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=3;
  const A0=[lerp(cardR[0],AI[0],conv),cardR[1]];
  ctx.beginPath();ctx.moveTo(A0[0],A0[1]);ctx.lineTo(lerp(A0[0],AI[0],lp),lerp(A0[1],AI[1],lp));ctx.stroke();
  // fan of lines (drawn under the tiles)
  ctx.lineWidth=1.6;
  const T=i=>i<8?20.84+i*0.022:21.02+(i-8)*0.024;
  LGS.forEach((lg,i)=>{const r=logoSlot(i);const q=eo(P(t,T(i)-0.06,0.22));if(q<=0)return;
    const tx=lerp(r.x,AI[0],conv),ty=lerp(r.y+r.h/2,AI[1],conv);
    ctx.beginPath();ctx.moveTo(AI[0],AI[1]);ctx.lineTo(lerp(AI[0],tx,q),lerp(AI[1],ty,q));ctx.stroke()});
  ctx.restore();
  // tiles pop in (no overshoot) and later collapse into the AI node
  LGS.forEach((lg,i)=>{const r0=logoSlot(i);const q=eo(P(t,T(i),0.26));
    const r={x:lerp(r0.x,AI[0]-r0.w/2,conv),y:lerp(r0.y,AI[1]-r0.h/2,conv),w:r0.w,h:r0.h};
    logoTile(lg,r,lerp(0.55,1,q)*(q>0?1:0)*(1-conv))});
  // AI node
  const ap=eo(P(t,20.72,0.26));const ar=lerp(56,0,eio(P(t,21.8,0.2)))*ap;
  if(ar>0){ctx.save();ctx.translate(AI[0],AI[1]);ctx.rotate(Math.PI/4);rect(-ar,-ar,ar*2,ar*2,C.orange);ctx.restore();}
  word('AUTOLINK AI',{t,x:AI[0],y:AI[1]+128,size:40,wt:900,ls:0,align:'center',tin:20.8,tout:21.55});
  word('FINANCE, FACILITATED.',{t,x:960,y:190,size:100,align:'center',tin:21.0,tout:21.6,color:C.ink});
  word('BANKS & FINANCE COMPANIES',{t,x:LG.x,y:905,size:30,wt:800,ls:0.05,tin:21.1,tout:21.45});
}

/* Bar 12 — TYPE STACK: NO ONE HAD / MAPPED / THIS MARKET / BEFORE. */
const LINES=[['NO ONE HAD',22.0],['MAPPED',22.5],['THIS MARKET',23.0],['BEFORE',23.5]];
function sType(t){
  const size=210,lh=200;
  let n=0;LINES.forEach((l,i)=>{if(t>=l[1])n=i});
  const shift=LINES.reduce((s,l,i)=>s+(i>0?eo(P(t,l[1],0.4))*lh:0),0);
  const baseY=590-shift+0;
  // zoom into the period
  const z=ei(P(t,23.72,0.28));
  const per=periodRect(baseY+3*lh,size);
  const zs=Math.pow(W/per.w*1.02,z); const pcx=per.x+per.w/2,pcy=per.y+per.h/2;
  ctx.save();
  ctx.translate(lerp(pcx,960,z),lerp(pcy,540,z));ctx.scale(zs,zs);ctx.translate(-pcx,-pcy);
  LINES.forEach((l,i)=>{const y=baseY+i*lh;
    if(i===2){word('THIS ',{t,x:120,y,size,tin:l[1]});word('MARKET',{t,x:120+measure('THIS ',size),y,size,tin:l[1]+0.11,color:C.blue})}
    else word(l[0],{t,x:120,y,size,tin:l[1]});
  });
  // period square grows in
  const pp=eo(P(t,23.66,0.2));
  if(pp>0){rect(per.x,per.y+per.h*(1-pp),per.w,per.h*pp,C.blue)}
  ctx.restore();
}
function periodRect(y,size){const x=120+measure('BEFORE',size)+size*0.04;const s=size*0.2;return {x,y:y-s,w:s,h:s}}

/* Bar 13 — RISER: the period becomes a photo; the grid doubles every beat */
function sSplit(t){
  const lv=t<24.5?0:t<25.0?1:t<25.5?2:t<25.75?3:4;
  const n=1<<lv; const T=[24.0,24.5,25.0,25.5,25.75][lv];
  const gut=[0,10,8,6,4][lv];
  const gp=eo(P(t,T,0.35));
  const z=1+0.04*(t-24);
  // blue square → full frame at 24.0
  const open=eio(P(t,23.95,0.0001));
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const cw=W/n,ch=H/n;const g=gut*gp;
    const x=i*cw+g/2,y=j*ch+g/2,w=cw-g,h=ch-g;
    const pi=i>>1,pj=j>>1;
    // child starts as crop of parent, then its own photo rolls in (stagger diagonal)
    const roll=lv===4?eio(P(t,T+0.01+((i+j)/(2*n))*0.1,0.12)):eio(P(t,T+0.06+((i+j)/(2*n))*0.22,0.26));
    ctx.save();clipRect(x,y,w,h);
    if(roll<1){ if(lv===0)rect(x,y,w,h,C.blue); else drawParentCrop(lv-1,pi,pj,-roll*h*(i%2?-1:1),z)}
    if(roll>0){const yy=y+(1-roll)*h*(i%2?-1:1);
      if(lv===4)ctx.drawImage(WALLF,i*120,j*67.5,120,67.5,x,yy,w,h);
      else img(photoFor(lv,i,j),x,yy,w,h,z+0.0,0.5,0.45)}
    ctx.restore();
  }
  // painted overlays per level
  if(lv===1){brushEllipse(W*0.75,H*0.25,170,90,0.05,eo(P(t,24.62,0.3)),C.orange,10,9)}
  if(lv===2){for(let k=0;k<5;k++){const i=[0,3,1,2,3][k],j=[0,0,2,3,2][k];checkMark(i*480+410,j*270+64,26,P(t,25.1+k*0.05,0.3),C.blue,C.white)}}
  // counter chip
  chip(t);
}
function chip(t){
  const nums=['001','004','016','064','256','520'],T=[24.06,24.5,25.0,25.5,25.75,26.0];const cw=330,cx=80,cy=H-80-130;
  const wv=cw*eo(P(t,24.0,0.3))*(1-eio(P(t,26.4,0.3)));if(wv<=0)return;
  ctx.save();rect(cx,cy,wv,130,C.white);clipRect(cx,cy,wv,130);
  for(let k=0;k<6;k++)word(nums[k],{t,x:cx+26,y:cy+108,size:120,tin:T[k],tout:k<5?T[k+1]:26.36,ls:-0.02,color:k===5?C.blue:C.ink});
  ctx.restore();
}
function drawParentCrop(pl,pi,pj,dy,z){ // the parent tile's photo, continuing under its children
  const n=1<<pl;const g=[0,10,8,6,4][pl];const PW=W/n,PH2=H/n;
  img(photoFor(pl,pi,pj),pi*PW+g/2,pj*PH2+g/2+dy,PW-g,PH2-g,z,0.5,0.45);
}

/* Bar 14 — STRONGEST: the wall tilts into 3D, flips in a wave to read ORGANIZED., then flies into the mark */
function sWall(t){
  const tiltA=lerp(0,16,eio(P(t,26.0,0.45)))*(1-eio(P(t,27.1,0.4)))*Math.PI/180;
  const tiltB=lerp(0,-22,eio(P(t,26.0,0.45)))*(1-eio(P(t,27.1,0.4)))*Math.PI/180;
  const S=lerp(1,0.84,eio(P(t,26.0,0.5)))*lerp(1,1.04,P(t,26.5,1.0));
  const fly=P(t,27.5,0.45);
  const items=[];
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){
    const k=j*16+i;
    const d=(i/15)*0.65+(j/15)*0.35;
    const th=Math.PI*eio(P(t,26.42+d*0.42,0.36));
    const cx=(i*120+60-960)*S, cy=(j*67.5+33.75-540)*S, w=116*S, h=63.5*S;
    const corner=(sx,sy)=>{let x=cx+sx*w/2*Math.cos(th), y=cy+sy*h/2, z=sx*w/2*Math.sin(th);
      // wall rotation: Y then X
      let X1=x*Math.cos(tiltB)+z*Math.sin(tiltB), Z1=-x*Math.sin(tiltB)+z*Math.cos(tiltB);
      let Y2=y*Math.cos(tiltA)-Z1*Math.sin(tiltA), Z2=y*Math.sin(tiltA)+Z1*Math.cos(tiltA);
      const kk=1800/(1800+Z2);return [960+X1*kk,540+Y2*kk,Z2]};
    items.push({i,j,k,th,TL:corner(-1,-1),TR:corner(1,-1),BL:corner(-1,1),z:corner(0,0)[2]});
  }
  if(fly>0){wallFly(t,items,fly);return}

  items.sort((a,b)=>b.z-a.z);
  for(const it of items){const back=Math.cos(it.th)<0;
    let {TL,TR,BL}=it; const sw=120,sh=67.5;
    const a=(TR[0]-TL[0])/sw,b=(TR[1]-TL[1])/sw,c=(BL[0]-TL[0])/sh,d=(BL[1]-TL[1])/sh;
    if(Math.abs(a*d-b*c)<1e-4)continue;
    ctx.save();ctx.setTransform(a,b,c,d,TL[0],TL[1]);
    if(!back)ctx.drawImage(WALLF,it.i*120,it.j*67.5,120,67.5,0,0,sw,sh);
    else{ctx.translate(sw,0);ctx.scale(-1,1);ctx.drawImage(WALLB,it.i*120,it.j*67.5,120,67.5,0,0,sw,sh)}
    ctx.restore();
  }
  ctx.setTransform(1,0,0,1,0,0);chip(t);
}
function wallFly(t,items,fly){
  for(const it of items){const s=MARK.slots[it.k%MARK.slots.length];
    const st=eio(cl((fly-hash(it.k)*0.25)/0.75));
    const x0=(it.TL[0]+it.TR[0])/2+ (it.BL[0]-it.TL[0])/2, y0=(it.TL[1]+it.BL[1])/2+(it.TR[1]-it.TL[1])/2;
    const w0=Math.hypot(it.TR[0]-it.TL[0],it.TR[1]-it.TL[1]), h0=Math.hypot(it.BL[0]-it.TL[0],it.BL[1]-it.TL[1]);
    const cell=MARK.a*Math.SQRT2/9+1.2;
    const x=lerp(x0,s[0],st),y=lerp(y0,s[1],st),w=lerp(w0,cell,st),h=lerp(h0,cell,st);
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4*st);
    if(st<0.55)ctx.drawImage(WALLB,it.i*120,it.j*67.5,120,67.5,-w/2,-h/2,w,h);
    else rect(-w/2,-h/2,w,h,MARK.D[s[2]][2]);
    ctx.restore();}
}

/* Bar 15 — END TITLE → back to the line */
function diamond(cx,cy,a){return [[cx,cy-a],[cx+a,cy],[cx,cy+a],[cx-a,cy]]}
function sEnd(t){
  const col=eio(P(t,29.42,0.5)); // collapse into line
  const push=1+0.03*P(t,28,1.4);
  const segs=[[920,1000],[900,940],[980,1020]]; // line thirds (x0,x1) for T,L,R  (line: 900..1020)
  const order=[1,0,2]; // L,T,R left→right: L=900-940, T=940-980, R=980-1020
  const lineX=[[940,980],[900,940],[980,1020]];
  MARK.D.forEach((dd,k)=>{
    const a=MARK.a*push; const cx=MARK.cx+(dd[0])*push, cy=MARK.cy+dd[1]*push;
    const dm=diamond(cx,cy,a);
    const lx=lineX[k];const ln=[[lx[0],536],[lx[1],536],[lx[1],544],[lx[0],544]];
    // map diamond verts (top,right,bottom,left) → rect (TL,TR,BR,BL)
    const pts=dm.map((p,i)=>[lerp(p[0],ln[i][0],col),lerp(p[1],ln[i][1],col)]);
    ctx.fillStyle=k===2?mixC(C.sky,C.blue,col):C.blue;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();
  });
  word('AUTOLINK',{t,x:960,y:720,size:170,align:'center',tin:28.02,tout:29.25,stg:0.03,ls:-0.03});
  word('THE SUB-DEALER MARKET, ORGANIZED.',{t,x:960,y:810,size:38,wt:800,ls:0.06,align:'center',tin:28.5,tout:29.25,stg:0.006});
}

/* ======================= COMPOSITOR ======================= */
function scene(t){
  ctx=AX;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  rect(0,0,W,H,C.white);
  t=((t%30)+30)%30;
  if(t<2.0)sHook(t);
  else if(t<4.5)s520(t);
  else if(t<6.0){s520(t);sNow(t)}
  else if(t<10.0){sCollage(t)}
  else if(t<14.0){sMorph(t)}
  else if(t<18.0){s3D(t)}
  else if(t<22.0)sData(t);
  else if(t<24.0)sType(t);
  else if(t<26.0)sSplit(t);
  else if(t<28.0)sWall(t);
  else sEnd(t);
}
function hookColsUnder(t){}
const SUB=2, SHUT=1/720; // in-frame shutter samples (direction-true motion blur)
window.seek=function(t){
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;
  for(let s=0;s<SUB;s++){scene(t+s*SHUT);X.globalAlpha=1/(s+1);X.drawImage(ACC,0,0)}
  X.globalAlpha=1;
};

  const names={aljabr:'Al Jabr Finance'};const bgs={ajb:'#6B6B6B',enbd:'#0B2147',yusr:'#0E3460'};
  const fill={ajb:1,enbd:1,yusr:1};
  window.LOGOS=await Promise.all(order.map(async id=>({id,name:names[id]||id,fill:!!fill[id],bg:bgs[id]||'#fff',img:names[id]?null:await loadImg('logos/'+id+'.png')})));
  ctx=AX;prep();window.seek(0);return true})();
